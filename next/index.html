<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec">
  <title>FORMA HOME / ФОРМА ХОУМ — каталог мебели</title>
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="stylesheet" href="styles-quiet-home-v1.css?v=20260812-1">
  <link rel="stylesheet" href="styles-executions-v2.css?v=20260812-1">
  <script defer src="site-content.js?v=20260812-1"></script>
  <script defer src="storefront-v2.js?v=20260812-1"></script>
</head>
<body>
  <header class="site-header">
    <div class="nav shell">
      <a class="brand" href="#catalog" aria-label="FORMA HOME / ФОРМА ХОУМ — к каталогу">
        <span class="brand-latin"><span>FORMA</span> <span class="brand-word-home">HOME</span></span>
        <span class="brand-slash" aria-hidden="true">/</span>
        <span class="brand-cyr"><span>ФОРМА</span> <span class="brand-word-home">ХОУМ</span></span>
      </a>
      <nav class="nav-actions" aria-label="Быстрые действия">
        <button class="icon-button" type="button" data-action="favorites" aria-pressed="false" aria-label="Избранное">
          <span aria-hidden="true">♡</span><span class="action-label">Избранное</span><b id="favorite-count">0</b>
        </button>
        <button class="icon-button cart-button" type="button" data-action="cart" aria-pressed="false" aria-label="Корзина">
          <span class="cart-icon" aria-hidden="true">🛒</span><span class="action-label">Корзина</span><b id="cart-count">0</b>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero shell" aria-busy="true">
      <div class="hero-rings" aria-hidden="true"></div>
      <p class="eyebrow" data-content="hero.eyebrow"></p>
      <h1 data-content="hero.title"></h1>
      <p class="hero-copy" data-content="hero.body"></p>
      <a class="primary-cta" data-content="hero.primaryCta" href="#catalog" hidden></a>
      <span id="model-count" hidden></span>
      <span id="variant-count" hidden></span>
    </section>

    <section class="catalog shell" id="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div><p class="eyebrow">Каталог</p><h2 id="catalog-title">Выберите мебель</h2></div>
        <p class="result-count" id="result-count" aria-live="polite">Загрузка…</p>
      </div>

      <div class="controls" aria-label="Поиск и фильтры">
        <label class="search-field">
          <span class="sr-only">Поиск товаров</span>
          <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Поиск по названию, коллекции, характеристикам">
        </label>
        <button class="search-action" id="search-submit" type="button">Найти товары</button>
        <label class="select-field" id="category-field">
          <span>Категория</span>
          <select id="category-filter"><option value="">Все категории</option></select>
        </label>
        <label class="select-field">
          <span>Коллекция</span>
          <select id="collection-filter"><option value="">Все коллекции</option></select>
        </label>
        <label class="select-field">
          <span>Цена</span>
          <select id="price-filter">
            <option value="">Любая</option>
            <option value="0-5000">до 5 000 ₽</option>
            <option value="5000-10000">5 000–10 000 ₽</option>
            <option value="10000-20000">10 000–20 000 ₽</option>
            <option value="20000-inf">от 20 000 ₽</option>
          </select>
        </label>
      </div>

      <div class="catalog-status" id="catalog-status" role="status">
        <span class="spinner" aria-hidden="true"></span> Подбираем товары…
      </div>
      <div class="product-grid" id="product-grid"></div>
      <nav class="pagination" id="pagination" aria-label="Страницы каталога" hidden></nav>
      <div class="empty-state" id="empty-state" hidden>
        <h3 id="empty-title">Ничего не нашли</h3>
        <p id="empty-copy">Измените запрос или сбросьте фильтры.</p>
        <button type="button" id="reset-filters">Вернуться ко всему каталогу</button>
      </div>
    </section>
  </main>

  <dialog class="product-dialog" id="product-dialog" aria-label="Карточка товара">
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Закрыть">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <template id="product-template">
    <article class="product-card">
      <div class="card-media">
        <button class="card-open card-image-open" type="button" aria-label="Открыть карточку товара">
          <span class="image-wrap"><img class="card-image" alt="" loading="lazy" decoding="async" width="640" height="640"></span>
        </button>
        <button class="card-gallery-arrow card-prev" type="button" aria-label="Предыдущее фото" hidden>‹</button>
        <button class="card-gallery-arrow card-next" type="button" aria-label="Следующее фото" hidden>›</button>
        <span class="card-gallery-count" hidden></span>
      </div>
      <div class="card-body">
        <span class="card-collection"></span>
        <button class="card-open card-info-open" type="button"><strong class="card-name"></strong></button>
        <span class="card-swatches" aria-label="Реальные исполнения товара"></span>
        <span class="card-meta"></span>
        <span class="card-price"></span>
        <del class="card-retail" hidden></del>
      </div>
      <button class="favorite-button" type="button" aria-label="Добавить исполнение в избранное">♡</button>
    </article>
  </template>

  <noscript><div class="noscript">Для каталога FORMA HOME требуется JavaScript.</div></noscript>
</body>
</html>
