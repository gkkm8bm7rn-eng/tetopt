<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FORMA HOME</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f2ec;color:#201f1b;font-family:system-ui,-apple-system,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot strong{font-family:Georgia,serif;font-size:28px;letter-spacing:.08em}
    .boot span{display:block;margin-top:12px;color:#706d65;font-size:14px}
  </style>
</head>
<body>
  <div class="boot"><div><strong>FORMA HOME</strong><span>Открываем каталог…</span></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch(`catalog-source.html?v=${Date.now()}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      let html=await response.text();

      const cssAnchor='    .photo-loading{position:absolute;left:12px;bottom:10px;z-index:3;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:5px 8px;border-radius:999px;font-size:10px;color:var(--muted)}\n';
      const cssExtra='    .photo-unavailable{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);padding:6px 10px;border-radius:999px;font-size:10px;color:var(--muted);white-space:nowrap}\n';
      if(!html.includes('.photo-unavailable{'))html=html.replace(cssAnchor,cssAnchor+cssExtra);

      html=html.replace(
        '    .visual{aspect-ratio:1.12;background:linear-gradient(135deg,#ebe5da,#d7dccc);display:grid;place-items:center;position:relative;overflow:hidden}',
        '    .visual{aspect-ratio:1.12;background:linear-gradient(135deg,#ebe5da,#d7dccc);display:grid;place-items:center;position:relative;overflow:hidden;touch-action:pan-y;user-select:none}'
      );
      html=html.replace(
        '    .gallery-main{position:relative;min-height:360px;border-radius:20px;overflow:hidden;background:#fff;display:grid;place-items:center}',
        '    .gallery-main{position:relative;min-height:360px;border-radius:20px;overflow:hidden;background:#fff;display:grid;place-items:center;touch-action:pan-y;user-select:none}'
      );

      html=html.replace(
`      let cardSwipe=null, suppressCardClick=false;
      $("#grid").addEventListener("click",e=>{
        const photoNav=e.target.closest("[data-card-photo]");
        if(photoNav){e.stopPropagation();shiftCardPhoto(photoNav,Number(photoNav.dataset.cardPhoto)||0);return}
        const add=e.target.closest("[data-add]"); if(add){e.stopPropagation();addToCart(add.dataset.add);return}
        const card=e.target.closest("[data-product]");
        if(card){
          if(suppressCardClick){suppressCardClick=false;return}
          openProduct(card.dataset.product);
        }
      });
      $("#grid").addEventListener("pointerdown",e=>{
        const visual=e.target.closest(".visual");
        if(!visual || e.target.closest("button") || e.pointerType==="mouse")return;
        cardSwipe={visual,x:e.clientX,y:e.clientY};
      });
      $("#grid").addEventListener("pointerup",e=>{
        if(!cardSwipe)return;
        const swipe=cardSwipe; cardSwipe=null;
        const visual=e.target.closest(".visual");
        if(visual!==swipe.visual)return;
        const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
        if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy)*1.2){
          shiftCardPhoto(visual,dx<0?1:-1);
          suppressCardClick=true;
          setTimeout(()=>{suppressCardClick=false},350);
        }
      });
      $("#grid").addEventListener("pointercancel",()=>{cardSwipe=null});`,
`      let cardSwipe=null, suppressCardClick=false;
      $("#grid").addEventListener("click",e=>{
        const photoNav=e.target.closest("[data-card-photo]");
        if(photoNav){e.stopPropagation();shiftCardPhoto(photoNav,Number(photoNav.dataset.cardPhoto)||0);return}
        const add=e.target.closest("[data-add]"); if(add){e.stopPropagation();addToCart(add.dataset.add);return}
        const card=e.target.closest("[data-product]");
        if(card){
          if(suppressCardClick){suppressCardClick=false;return}
          openProduct(card.dataset.product);
        }
      });
      $("#grid").addEventListener("touchstart",e=>{
        const touch=e.touches[0];
        const visual=e.target.closest(".visual");
        if(!touch || !visual || e.target.closest("button"))return;
        cardSwipe={visual,x:touch.clientX,y:touch.clientY};
      },{passive:true});
      $("#grid").addEventListener("touchend",e=>{
        if(!cardSwipe)return;
        const swipe=cardSwipe; cardSwipe=null;
        const touch=e.changedTouches[0];
        const visual=e.target.closest(".visual");
        if(!touch || visual!==swipe.visual)return;
        const dx=touch.clientX-swipe.x,dy=touch.clientY-swipe.y;
        if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy)*1.2){
          shiftCardPhoto(visual,dx<0?1:-1);
          suppressCardClick=true;
          setTimeout(()=>{suppressCardClick=false},650);
        }
      },{passive:true});
      $("#grid").addEventListener("touchcancel",()=>{cardSwipe=null},{passive:true});`
      );

      html=html.replace(
        '          <span class="photo-loading">загрузка фото…</span>\n          ${cardPhotos.length>1?',
        '          ${cardPhotos.length?`<span class="photo-loading">загрузка фото…</span>`:`<span class="photo-unavailable">Фото пока недоступно</span>`}\n          ${cardPhotos.length>1?'
      );

      html=html.replace(
        '.then(url=>url&&applyPhoto(job.img,url,job.p))',
        '.then(url=>url?applyPhoto(job.img,url,job.p):markPhotoFailed(job.img))'
      );

      html=html.replace(
`        const visual=img.closest(".visual,.modal-visual");
        visual?.querySelector(".photo-placeholder")?.setAttribute("hidden","");
        visual?.querySelector(".photo-loading")?.remove();`,
`        const visual=img.closest(".visual,.modal-visual");
        visual?.querySelector(".photo-placeholder")?.setAttribute("hidden","");
        visual?.querySelector(".photo-loading")?.remove();
        visual?.querySelector(".photo-unavailable")?.remove();`
      );

      html=html.replace(
`    function markPhotoFailed(img){
      img.classList.add("failed");
      img.closest(".visual,.modal-visual")?.querySelector(".photo-loading")?.remove();
    }`,
`    function markPhotoFailed(img){
      img.classList.add("failed");
      const visual=img.closest(".visual,.modal-visual");
      visual?.querySelector(".photo-loading")?.remove();
      if(visual && !visual.querySelector(".photo-unavailable")){
        visual.insertAdjacentHTML("beforeend",'<span class="photo-unavailable">Фото пока недоступно</span>');
      }
    }`
      );

      html=html.replace(
`    async function loadProductGallery(p){
      const status=$("#galleryStatus");
      const photos=await resolveProductGallery(p,10);`,
`    async function loadProductGallery(p){
      const status=$("#galleryStatus");
      let photos=[];
      try{photos=await resolveProductGallery(p,10)}catch{}`
      );

      html=html.replace(
`      if(!photos.length){
        if(status)status.textContent="Фотографии временно недоступны";
        $("#galleryThumbs").innerHTML='<div class="gallery-empty">Попробуйте открыть карточку немного позже.</div>';
        return;
      }`,
`      if(!photos.length){
        if(status){status.hidden=false;status.textContent="Фото пока недоступно"}
        $("#galleryThumbs").innerHTML='<div class="gallery-empty">Для этого товара фотография пока не найдена.</div>';
        return;
      }`
      );

      html=html.replace(
`        }else if(status){
          status.hidden=false;
          status.textContent="Фотографии временно недоступны";
        }`,
`        }else if(status){
          if(placeholder)placeholder.hidden=false;
          status.hidden=false;
          status.textContent="Фото пока недоступно";
          $("#galleryThumbs").innerHTML='<div class="gallery-empty">Для этого товара фотография пока не найдена.</div>';
        }`
      );

      html=html.replace(
`      const p=productById(id); if(!p)return;
      activeGallery={productId:p.id,photos:[],index:0};`,
`      const p=productById(id); if(!p)return;
      const hasLocalPhotos=Array.isArray(p.images)&&p.images.some(Boolean);
      activeGallery={productId:p.id,photos:[],index:0};`
      );

      html=html.replace(
        '<span class="gallery-status" id="galleryStatus">загрузка фотографий…</span>',
        '<span class="gallery-status" id="galleryStatus">${hasLocalPhotos?"загрузка фотографий…":"Фото пока недоступно"}</span>'
      );

      html=html.replace(
`      $("#overlay").classList.add("show");
      $("#modal").classList.add("show");
      loadProductGallery(p);`,
`      $("#overlay").classList.add("show");
      $("#modal").classList.add("show");
      const gallerySurface=$("#modal .gallery-main");
      let gallerySwipe=null;
      gallerySurface?.addEventListener("touchstart",e=>{
        const touch=e.touches[0];
        if(!touch || e.target.closest("button"))return;
        gallerySwipe={x:touch.clientX,y:touch.clientY};
      },{passive:true});
      gallerySurface?.addEventListener("touchend",e=>{
        if(!gallerySwipe)return;
        const touch=e.changedTouches[0];
        if(!touch){gallerySwipe=null;return}
        const dx=touch.clientX-gallerySwipe.x,dy=touch.clientY-gallerySwipe.y;
        gallerySwipe=null;
        if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy)*1.2)shiftGallery(dx<0?1:-1);
      },{passive:true});
      gallerySurface?.addEventListener("touchcancel",()=>{gallerySwipe=null},{passive:true});
      loadProductGallery(p);`
      );

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot"><div><strong>FORMA HOME</strong><span>Не удалось открыть каталог. Обновите страницу.</span></div></div>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
