<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec">
  <title>FORMA HOME — нет соединения</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f5f2ec;color:#201f1b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:34px;border:1px solid #ded8cc;border-radius:28px;background:linear-gradient(135deg,#ded5c2,#abb397);box-shadow:0 18px 48px rgba(63,52,38,.12)}
    .logo{font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.12em}.logo span{color:#536647}
    h1{margin:34px 0 12px;font-family:Georgia,serif;font-size:clamp(38px,10vw,58px);font-weight:500;line-height:1}
    p{margin:0;color:#454a43;font-size:17px;line-height:1.5}
    button{width:100%;margin-top:28px;min-height:56px;border:0;border-radius:18px;background:#201f1b;color:#fff;font:800 17px system-ui,-apple-system,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">FORMA <span>HOME</span></div>
    <h1>Соединение прервалось</h1>
    <p>Сохранённые страницы и просмотренные товары останутся доступны. Проверьте интернет и попробуйте открыть каталог снова.</p>
    <button type="button" onclick="location.reload()">Повторить загрузку</button>
  </main>
</body>
</html>
