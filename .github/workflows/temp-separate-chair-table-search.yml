name: Temporary chair table search distinction
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-separate-chair-table-search.py'
      - '.github/workflows/temp-separate-chair-table-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
      - name: Apply search distinction
        run: python3 .tmp-separate-chair-table-search.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          grep -q "function isDistinctFurnitureToken" app.js
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet || git commit -m 'Keep chair and table searches distinct'
          git push origin HEAD:forma-atelier-zero-2026
