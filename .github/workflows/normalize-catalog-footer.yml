name: Finalize catalog footer source

on:
  push:
    branches: [main]
    paths:
      - "data/finalize-footer-run.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize footer and remove temporary loader replacement
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("catalog-source.html")
          source = source_path.read_text(encoding="utf-8")

          old_footer = '''      <div><div class="logo">FORMA <span>HOME</span></div><p>Демонстрационная версия интернет-магазина на основе загруженного каталога товаров.</p></div>
      <div id="delivery"><h4>Покупателям</h4><p><a href="#">Доставка и оплата</a><br><a href="#">Гарантия и возврат</a><br><a href="#">Политика конфиденциальности</a></p></div>
      <div id="contacts"><h4>Контакты</h4><p>Телефон: +7 (___) ___-__-__<br>E-mail: hello@example.ru<br>Ежедневно, 10:00–20:00</p></div>'''

          new_footer = '''      <div><div class="logo">FORMA <span>HOME</span></div><p>Мебель и предметы интерьера. Оптовые цены, удобный подбор и оформление заказа онлайн.</p></div>
      <div id="delivery"><h4>Покупателям</h4><p><a href="#catalog">Перейти в каталог</a><br><a href="#contacts">Связаться с нами</a></p></div>
      <div id="contacts"><h4>Контакты</h4><p>Телефон: <a href="tel:+79057267946">+7 (905) 726-79-46</a><br><a href="https://wa.me/79057267946" target="_blank" rel="noopener">WhatsApp</a> · <a href="https://t.me/+79057267946" target="_blank" rel="noopener">Telegram</a><br>E-mail: <a href="mailto:postes@mail.ru">postes@mail.ru</a><br>Ежедневно, 10:00–20:00</p></div>'''

          if old_footer in source:
              source = source.replace(old_footer, new_footer, 1)
          elif new_footer not in source:
              raise SystemExit("Neither placeholder nor finalized footer was found in catalog-source.html")

          if "Демонстрационная версия интернет-магазина" in source or "hello@example.ru" in source:
              raise SystemExit("Placeholder footer text remains in catalog-source.html")
          source_path.write_text(source, encoding="utf-8")

          loader_path = Path("catalog-loader.js")
          loader = loader_path.read_text(encoding="utf-8")
          start_marker = '\n    const placeholderFooter=`'
          end_marker = '\n    html=html.replace(placeholderFooter,realFooter);\n'
          start = loader.find(start_marker)
          end = loader.find(end_marker)
          if start != -1 and end != -1 and end >= start:
              end += len(end_marker)
              loader = loader[:start] + "\n" + loader[end:]
          if "placeholderFooter" in loader or "realFooter" in loader:
              raise SystemExit("Temporary footer replacement remains in catalog-loader.js")
          loader_path.write_text(loader, encoding="utf-8")

      - name: Remove all one-time footer cleanup files
        shell: bash
        run: |
          rm -f \
            .github/workflows/normalize-catalog-footer.yml \
            data/footer-normalize-trigger.txt \
            data/footer-normalize-pr-trigger.txt \
            data/footer-normalize-v2-trigger.txt \
            data/finalize-footer-source.txt \
            data/finalize-footer-source-note.txt \
            data/finalize-footer-run.txt

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Мебель и предметы интерьера. Оптовые цены' catalog-source.html
          ! grep -q 'Демонстрационная версия интернет-магазина' catalog-source.html
          ! grep -q 'hello@example.ru' catalog-source.html
          ! grep -q 'placeholderFooter' catalog-loader.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize catalog footer source"
          git push origin HEAD:main