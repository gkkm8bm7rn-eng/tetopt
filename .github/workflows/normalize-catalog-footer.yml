name: Normalize catalog footer source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-footer:
    if: ${{ !contains(github.event.head_commit.message || '', 'Normalize catalog footer source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace placeholder footer in catalog source
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog-source.html")
          text = path.read_text(encoding="utf-8")

          old = '''      <div><div class="logo">FORMA <span>HOME</span></div><p>Демонстрационная версия интернет-магазина на основе загруженного каталога товаров.</p></div>
      <div id="delivery"><h4>Покупателям</h4><p><a href="#">Доставка и оплата</a><br><a href="#">Гарантия и возврат</a><br><a href="#">Политика конфиденциальности</a></p></div>
      <div id="contacts"><h4>Контакты</h4><p>Телефон: +7 (___) ___-__-__<br>E-mail: hello@example.ru<br>Ежедневно, 10:00–20:00</p></div>'''

          new = '''      <div><div class="logo">FORMA <span>HOME</span></div><p>Мебель и предметы интерьера. Оптовые цены, удобный подбор и оформление заказа онлайн.</p></div>
      <div id="delivery"><h4>Покупателям</h4><p><a href="#catalog">Перейти в каталог</a><br><a href="#contacts">Связаться с нами</a></p></div>
      <div id="contacts"><h4>Контакты</h4><p>Телефон: <a href="tel:+79057267946">+7 (905) 726-79-46</a><br><a href="https://wa.me/79057267946" target="_blank" rel="noopener">WhatsApp</a> · <a href="https://t.me/+79057267946" target="_blank" rel="noopener">Telegram</a><br>E-mail: <a href="mailto:postes@mail.ru">postes@mail.ru</a><br>Ежедневно, 10:00–20:00</p></div>'''

          if old not in text:
              print("Placeholder footer is already absent; nothing to change.")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Footer updated in catalog-source.html")

      - name: Commit normalized source
        run: |
          if git diff --quiet -- catalog-source.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html
          git commit -m "Normalize catalog footer source"
          git push
