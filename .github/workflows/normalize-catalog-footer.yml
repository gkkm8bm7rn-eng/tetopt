name: Finalize catalog footer source

on:
  push:
    branches:
      - main
    paths:
      - "data/finalize-footer-run-v3.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize footer and loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("catalog-source.html")
          source = source_path.read_text(encoding="utf-8")
          footer = "\n".join([
              '  <footer>',
              '    <div class="container footer-grid">',
              '      <div><div class="logo">FORMA <span>HOME</span></div><p>Мебель и предметы интерьера. Оптовые цены, удобный подбор и оформление заказа онлайн.</p></div>',
              '      <div id="delivery"><h4>Покупателям</h4><p><a href="#catalog">Перейти в каталог</a><br><a href="#contacts">Связаться с нами</a></p></div>',
              '      <div id="contacts"><h4>Контакты</h4><p>Телефон: <a href="tel:+79057267946">+7 (905) 726-79-46</a><br><a href="https://wa.me/79057267946" target="_blank" rel="noopener">WhatsApp</a> · <a href="https://t.me/+79057267946" target="_blank" rel="noopener">Telegram</a><br>E-mail: <a href="mailto:postes@mail.ru">postes@mail.ru</a><br>Ежедневно, 10:00–20:00</p></div>',
              '    </div>',
              '  </footer>',
          ])
          start = source.find("  <footer>")
          end = source.find("\n\n  <div class=\"overlay\"", start)
          if start == -1 or end == -1:
              raise SystemExit("Footer boundaries were not found")
          source = source[:start] + footer + source[end:]
          if "Демонстрационная версия интернет-магазина" in source or "hello@example.ru" in source:
              raise SystemExit("Placeholder footer remains")
          source_path.write_text(source, encoding="utf-8")

          loader_path = Path("catalog-loader.js")
          loader = loader_path.read_text(encoding="utf-8")
          start_marker = "\n    const placeholderFooter=`"
          end_marker = "\n    html=html.replace(placeholderFooter,realFooter);\n"
          block_start = loader.find(start_marker)
          block_end = loader.find(end_marker)
          if block_start != -1 and block_end != -1 and block_end >= block_start:
              loader = loader[:block_start] + "\n" + loader[block_end + len(end_marker):]
          if "placeholderFooter" in loader or "realFooter" in loader:
              raise SystemExit("Temporary footer replacement remains")
          loader_path.write_text(loader, encoding="utf-8")
          PY

      - name: Remove temporary trigger files
        shell: bash
        run: |
          rm -f \
            data/footer-normalize-trigger.txt \
            data/footer-normalize-pr-trigger.txt \
            data/footer-normalize-v2-trigger.txt \
            data/finalize-footer-source.txt \
            data/finalize-footer-source-note.txt \
            data/finalize-footer-run.txt \
            data/finalize-footer-run-v2.txt \
            data/finalize-footer-run-v3.txt

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Мебель и предметы интерьера. Оптовые цены' catalog-source.html
          ! grep -q 'Демонстрационная версия интернет-магазина' catalog-source.html
          ! grep -q 'hello@example.ru' catalog-source.html
          ! grep -q 'placeholderFooter' catalog-loader.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog-source.html catalog-loader.js data
          git commit -m "Finalize catalog footer source"
          git push origin HEAD:main
