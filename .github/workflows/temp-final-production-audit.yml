name: Temporary final production audit
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-final-production-audit.mjs'
      - '.github/workflows/temp-final-production-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Validate files and data
        run: |
          node --check app.js
          node --check variants.js
          python3 - <<'PY'
          import json,glob
          idx=json.load(open('data/catalog-index.json',encoding='utf-8'))
          assert idx.get('products') and len(idx['products'])>500
          for f in glob.glob('data/details/*.json'): json.load(open(f,encoding='utf-8'))
          print('JSON OK',len(idx['products']),len(glob.glob('data/details/*.json')))
          PY
      - name: Verify price data unchanged since corrected sync
        run: |
          git diff --quiet a60fb3330ca5a4e4e2659d72bc0d6bf83e16b4b9 -- data/catalog-index.json data/details || (echo 'Price/catalog data changed after verified sync' && exit 1)
      - name: Start site
        run: |
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Browser audit
        run: node .tmp-final-production-audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-audit
          path: final-audit-*.png
