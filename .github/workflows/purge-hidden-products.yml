name: Purge hidden products

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  purge:
    if: github.event.issue.title == 'RUN VERIFIED HIDDEN PRODUCT PURGE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove and verify hidden products
        run: |
          node --check scripts/purge-hidden-products.mjs
          node scripts/purge-hidden-products.mjs
          git diff --check

      - name: Commit verified catalog cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html hidden-products.json archive/hidden-products-removed-2026-08-06.json
          git commit -m "Remove hidden products from catalog source"
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Verified purge completed and committed to main."
