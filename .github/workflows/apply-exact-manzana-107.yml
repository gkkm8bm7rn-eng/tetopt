name: Apply exact Manzana 107

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    paths:
      - data/run-apply-exact-manzana-107.trigger

permissions:
  contents: write

concurrency:
  group: apply-exact-manzana-107-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Fetch and apply official supplier photos
        run: python scripts/apply_exact_manzana_107.py

      - name: Validate loader syntax
        run: node --check catalog-loader.js

      - name: Commit exact photos and catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/products/107 catalog-source.html catalog-loader.js index.html photo-processing-progress.json data/batch-04-exact-manzana-107-report.json
          git commit -m "Применить точные фото Manzana для ID 107"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
