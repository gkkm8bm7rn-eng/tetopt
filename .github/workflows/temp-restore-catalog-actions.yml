name: Temporary restore Atelier catalog actions
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-restore-catalog-actions.py'
      - '.github/workflows/temp-restore-catalog-actions.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Apply catalogue interaction repair
        run: python .tmp-restore-catalog-actions.py
      - name: Validate
        run: |
          node --check app.js
          node --check variants.js
          grep -q 'class="product-info" data-open=' variants.js
          grep -q '>Добавить в заказ</button>' variants.js
          ! grep -q '.quick-add{display:none}' styles.css
          grep -q 'class="cart-trolley"' index.html
          grep -q 'if(b.dataset.favorite){e.preventDefault();e.stopPropagation();toggleFavorite(b.dataset.favorite);return}' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variants.js styles.css index.html
          git commit -m "Restore Atelier catalog actions and trolley icon"
          git push origin HEAD:forma-atelier-zero-2026
