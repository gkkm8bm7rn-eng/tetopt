name: Pages source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-source-diagnostic.yml'

permissions:
  contents: write
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          pages_status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/pages" || true)
          latest_status=$(curl -sS -o /tmp/latest.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/pages/builds/latest" || true)
          PAGES_STATUS="$pages_status" LATEST_STATUS="$latest_status" python - <<'PY'
          import json, os
          def load(path):
              try:
                  with open(path, encoding='utf-8') as f: return json.load(f)
              except Exception as e:
                  return {'parse_error': str(e)}
          out = {
              'pages_http_status': os.environ.get('PAGES_STATUS'),
              'pages': load('/tmp/pages.json'),
              'latest_build_http_status': os.environ.get('LATEST_STATUS'),
              'latest_build': load('/tmp/latest.json'),
              'trigger_sha': os.environ.get('TRIGGER_SHA'),
          }
          with open('data/pages-diagnostic.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
      - name: Save diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pages-diagnostic.json
          git commit -m 'Record temporary Pages diagnostic' || exit 0
          git push origin HEAD:main
