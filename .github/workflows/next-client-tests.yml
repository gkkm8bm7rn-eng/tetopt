name: Next catalog client tests

on:
  pull_request:
    paths:
      - 'next/**'
      - 'catalog.json'
      - 'assets/products/**'
      - 'scripts/e2e-next-client.mjs'
      - 'scripts/e2e-next-lazy-scroll.mjs'
      - '.github/workflows/next-client-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-client-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
      NEXT_E2E_OUT: artifacts/next-client-${{ matrix.engine }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate client JavaScript
        run: node --check next/app.js && node --check scripts/e2e-next-client.mjs && node --check scripts/e2e-next-lazy-scroll.mjs

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Start local storefront
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/forma-next-http.log 2>&1 &
          echo $! > /tmp/forma-next-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/next/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forma-next-http.log
          exit 1

      - name: Run responsive catalog checks
        run: node scripts/e2e-next-client.mjs

      - name: Verify lazy images and load-more scrolling
        run: node scripts/e2e-next-lazy-scroll.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/forma-next-http.log || true

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-client-${{ matrix.engine }}-results
          path: artifacts/next-client-${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 7
