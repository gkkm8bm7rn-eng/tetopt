name: Apply primary photo order

on:
  push:
    branches:
      - agent/fix-primary-product-photos
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply verified first-photo order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # User-marked examples take priority over automated angle scoring.
          # Rear and side views remain available, but never occupy the first slot.
          VERIFIED_ORDERS = {
              493: ['assets/products/493/02.webp', 'assets/products/493/03.webp', 'assets/products/493/01.webp'],
              896: ['assets/products/896/01.webp', 'assets/products/896/03.webp', 'assets/products/896/02.webp'],
              189: ['assets/products/189/01.webp', 'assets/products/189/02.webp', 'assets/products/189/03.webp'],
              136: ['assets/products/136/01.webp', 'assets/products/136/03.webp', 'assets/products/136/02.webp'],
              70: ['assets/products/70/01.webp', 'assets/products/70/02.webp', 'assets/products/70/03.webp'],
              1477: ['assets/products/1477/01.webp', 'assets/products/1477/03.webp', 'assets/products/1477/02.webp'],
              33: ['assets/products/33/02.webp', 'assets/products/33/01.webp', 'assets/products/33/03.webp'],
              656: ['assets/products/656/03.webp', 'assets/products/656/02.webp', 'assets/products/656/01.webp'],
              843: ['assets/products/843/01.webp', 'assets/products/843/02.webp', 'assets/products/843/03.webp'],
              1182: ['assets/products/1182/01.webp', 'assets/products/1182/02.webp', 'assets/products/1182/03.webp'],
              312: ['assets/products/312/01.webp', 'assets/products/312/02.webp', 'assets/products/312/03.webp'],
              1037: ['assets/products/1037/02.webp', 'assets/products/1037/03.webp', 'assets/products/1037/01.webp'],
              1005: ['assets/products/1005/02.webp', 'assets/products/1005/03.webp', 'assets/products/1005/01.webp'],
              893: ['assets/products/893/01.webp', 'assets/products/893/02.webp', 'assets/products/893/03.webp'],
              863: ['assets/products/863/03.webp', 'assets/products/863/02.webp', 'assets/products/863/01.webp'],
              855: ['assets/products/855/02.webp', 'assets/products/855/01.webp', 'assets/products/855/03.webp'],
              307: ['assets/products/307/03.webp', 'assets/products/307/02.webp', 'assets/products/307/01.webp'],
              897: ['assets/products/897/01.webp', 'assets/products/897/03.webp', 'assets/products/897/02.webp'],
          }

          source = Path('catalog-source.html')
          text = source.read_text(encoding='utf-8')
          marker = '    const PRODUCTS = '
          start = text.find(marker)
          if start < 0:
              raise SystemExit('PRODUCTS marker not found')
          value_start = start + len(marker)
          end = text.find(';\n', value_start)
          if end < 0:
              raise SystemExit('PRODUCTS array end not found')

          products = json.loads(text[value_start:end])
          by_id = {int(product['id']): product for product in products}
          audit = []

          for product_id, verified_order in VERIFIED_ORDERS.items():
              product = by_id.get(product_id)
              if product is None:
                  raise SystemExit(f'Product {product_id} not found')
              before = [image for image in product.get('images', []) if image]
              if set(before) != set(verified_order):
                  raise SystemExit(
                      f'Product {product_id} gallery changed unexpectedly: '
                      f'before={before!r}, expected_set={verified_order!r}'
                  )
              product['images'] = verified_order
              product['directImage'] = verified_order[0]
              audit.append({
                  'id': product_id,
                  'name': product.get('name'),
                  'before': before,
                  'after': verified_order,
                  'firstImage': verified_order[0],
                  'status': 'front_or_front_three_quarter_first',
              })

          new_array = json.dumps(products, ensure_ascii=False, separators=(',', ':'))
          source.write_text(text[:value_start] + new_array + text[end:], encoding='utf-8')

          audit_path = Path('data/primary-photo-order-audit.json')
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated and verified {len(audit)} product galleries')
          PY

      - name: Commit verified order
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html data/primary-photo-order-audit.json
          git commit -m "Put verified front views first for marked products"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not push verified order after retries" >&2
          exit 1
