name: Correct batch 18 side views

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/correct-batch-18-side-views.yml"]

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'agent/correct-batch-18-side-views'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/correct-batch-18-side-views
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          import copy,json,re,subprocess
          from pathlib import Path
          ROOT=Path('.')
          BAD=[1576,1591,1593,1594,1595]
          PREVIOUS='1735fcd4a66f8126553401100f4aad22158396ba'
          def parse(text):
              marker='const PRODUCTS ='; start=text.index(marker)+len(marker)
              while text[start].isspace(): start+=1
              products,used=json.JSONDecoder().raw_decode(text[start:])
              return products,start,start+used
          current_text=(ROOT/'catalog-source.html').read_text(encoding='utf-8')
          previous_text=subprocess.run(['git','show',f'{PREVIOUS}:catalog-source.html'],check=True,capture_output=True,text=True).stdout
          current,start,end=parse(current_text); previous,_,_=parse(previous_text)
          current_by={int(p['id']):p for p in current}; previous_by={int(p['id']):p for p in previous}
          baseline=copy.deepcopy(current_by)
          for product_id in BAD:
              current_by[product_id]['images']=copy.deepcopy(previous_by[product_id].get('images',[]))
              current_by[product_id]['directImage']=previous_by[product_id].get('directImage')
          for product_id,product in current_by.items():
              if product_id not in BAD and product!=baseline[product_id]:
                  raise SystemExit(f'Изменена посторонняя карточка {product_id}')
          payload=json.dumps(current,ensure_ascii=False,separators=(',',':'))
          (ROOT/'catalog-source.html').write_text(current_text[:start]+payload+current_text[end:],encoding='utf-8')

          report_path=ROOT/'data/confirmed-photo-release-batch-18.json'
          report=json.loads(report_path.read_text(encoding='utf-8'))
          published=[int(v) for v in report.get('published_ids',[]) if int(v) not in BAD]
          skipped=sorted(set(int(v) for v in report.get('skipped_as_uncertain',[]))|set(BAD))
          if len(published)!=55:
              raise SystemExit(f'После исправления ожидалось 55 опубликованных ID, получено {len(published)}')
          report['published_products']=55
          report['published_ids']=published
          report['skipped_as_uncertain']=skipped
          report['total_confirmed_after_release']=879
          report['correction']='removed_side_or_rear_covers'
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          loader=ROOT/'catalog-loader.js'; text=loader.read_text(encoding='utf-8')
          text,count=re.subn(r'const assetVersion="[^"]+";','const assetVersion="20260801-confirmed-batch-18-corrected";',text,count=1)
          if count!=1: raise SystemExit('Не найдена версия ассетов')
          loader.write_text(text,encoding='utf-8')

          for product_id in BAD:
              product=current_by[product_id]
              if not product.get('images') or product.get('directImage')!=product['images'][0]:
                  raise SystemExit(f'ID {product_id}: не восстановлена обложка')
          print('Исправлены ID:',BAD)
          PY
          node --check image-zoom.js
          grep -q touchstart image-zoom.js
          grep -q touchend image-zoom.js
      - shell: bash
        run: |
          git add catalog-source.html catalog-loader.js data/confirmed-photo-release-batch-18.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct five side or rear covers from batch 18"
          git push origin HEAD:agent/correct-batch-18-side-views
