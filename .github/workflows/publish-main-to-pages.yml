name: Publish main to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: forma-home-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mirror main to configured Pages branch
        run: git push origin HEAD:refs/heads/forma-atelier-zero-2026 --force
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/pages/builds"
