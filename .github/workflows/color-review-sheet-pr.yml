name: Build color review sheet on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/**'
      - '.github/workflows/color-review-sheet-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build Amura review sheet
        env:
          MODEL_QUERY: "Амура|Amura"
          MODEL_SLUG: "amura"
        run: python tools/build_named_model_review.py
      - name: Upload review sheet
        uses: actions/upload-artifact@v4
        with:
          name: amura-all-variants
          path: review-output/
          retention-days: 1
