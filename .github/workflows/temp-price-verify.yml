name: Temporary Atelier price verification
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.github/workflows/temp-price-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Compare wholesale prices with main
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json,re,subprocess,glob
          main=subprocess.check_output(['git','show','origin/main:catalog-source.html'],text=True,errors='ignore')
          pairs={}
          for m in re.finditer(r'"sourceId"\s*:\s*"?(\d+)"?[\s\S]{0,1600}?"wholesalePrice"\s*:\s*(\d+(?:\.\d+)?)',main):
              pairs[m.group(1)]=float(m.group(2))
          print('main sourceId prices parsed:',len(pairs))
          if not pairs: raise SystemExit('Could not parse main wholesale prices')
          mismatches=[]; checked=set()
          for path in ['data/catalog-index.json',*glob.glob('data/details/*.json')]:
              data=json.load(open(path,encoding='utf-8'))
              products=data.get('products',{})
              iterable=products if isinstance(products,list) else products.values()
              for p in iterable:
                  for v in p.get('variants',[]):
                      sid=str(v.get('sourceId',''))
                      if sid in pairs:
                          checked.add(sid)
                          got=float(v.get('wholesalePrice') or 0)
                          if abs(got-pairs[sid])>0.001:mismatches.append((sid,got,pairs[sid],path))
          print('unique Atelier sourceIds compared:',len(checked))
          if mismatches:
              print('mismatches:',mismatches[:50])
              raise SystemExit(f'{len(mismatches)} wholesale price mismatches')
          print('Wholesale price verification passed.')
          PY
