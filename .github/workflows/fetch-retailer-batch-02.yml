name: Fetch exact retailer photos for batch 02

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-fetch-retailer-batch-02.trigger

permissions:
  contents: write

concurrency:
  group: fetch-retailer-batch-02
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless

      - name: Fetch exact high-resolution product photos
        continue-on-error: true
        run: |
          rm -rf data/retailer-batch-02
          python scripts/fetch_vseinstrumenti_batch.py \
            --source data/vseinstrumenti-batch-02.json \
            --out data/retailer-batch-02 \
            --min-side 700

      - name: Commit exact retailer candidates and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retailer-batch-02
          if git diff --cached --quiet; then
            echo "No exact retailer report changes"
          else
            git commit -m "Fetch exact retailer photos for batch 02"
            git push
          fi
