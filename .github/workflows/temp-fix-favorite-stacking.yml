name: Temporary fix Atelier favorite stacking

on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-favorite-direct-render.py'
      - '.github/workflows/temp-fix-favorite-stacking.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Apply direct favorite rendering
        run: python .tmp-favorite-direct-render.py
      - name: Validate
        run: |
          node --check app.js
          test -f assets/ui/favorite-inactive.png
          test -f assets/ui/favorite-active.png
          grep -q 'background-image:var(--favorite-image)!important' card-polish.css
          grep -q 'button\[data-favorite\]::before,button\[data-favorite\]::after{content:none!important' card-polish.css
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-polish.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render Atelier favorite icons directly on controls"
            git push origin HEAD:forma-atelier-zero-2026
          fi
