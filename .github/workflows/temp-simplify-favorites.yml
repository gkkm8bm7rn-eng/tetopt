name: Temporary simplify Atelier favorites
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-simplify-favorites.py'
      - '.github/workflows/temp-simplify-favorites.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Simplify favorites
        run: python .tmp-simplify-favorites.py
      - name: Validate
        run: |
          node --check app.js
          grep -q 'FORMA FAVORITE CONTROLS — simple native hearts' card-polish.css
          grep -q 'toggleFavorite(b.dataset.favorite);return}if(b.dataset.open)' app.js
          ! grep -q 'FAVORITE_ICON_ACTIVE' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js card-polish.css
          git commit -m "Simplify Atelier favorites to native heart controls"
          git push origin HEAD:forma-atelier-zero-2026
