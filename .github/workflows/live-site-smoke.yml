name: Live site smoke check

on:
  push:
    branches:
      - site-verification-fix-20260908

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify deployed GitHub Pages site
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';

          const base='https://gkkm8bm7rn-eng.github.io/tetopt/';
          const phone='79057267946';
          const email='postes@mail.ru';
          const source=await fetch(base+'search-fallback.js?smoke='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Live search-fallback.js HTTP '+r.status);return r.text()});
          if(!source.includes("const CONTACT_PHONE='79057267946';"))throw new Error('Live site has wrong contact phone');
          if(!source.includes("const CONTACT_EMAIL='postes@mail.ru';"))throw new Error('Live site has wrong contact email');
          if(!source.includes('https://wa.me/${CONTACT_PHONE}?text='))throw new Error('Live WhatsApp formatter missing');
          if(!source.includes('https://t.me/+${CONTACT_PHONE}?text='))throw new Error('Live Telegram formatter missing');

          const chrome=execSync('which google-chrome || which chromium || which chromium-browser',{shell:'/bin/bash'}).toString().trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setCacheEnabled(false);
          const pageErrors=[];
          page.on('pageerror',error=>pageErrors.push(String(error)));
          await page.goto(base+'?smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForSelector('.product-card',{timeout:45000});
          const productCount=await page.$$eval('.product-card',nodes=>nodes.length);
          if(productCount<1)throw new Error('Live catalog did not render products');

          await page.click('[data-main-category="interior"]');
          await page.type('#searchInput','стул');
          await page.click('#searchForm .search-submit');
          await new Promise(resolve=>setTimeout(resolve,300));
          if(pageErrors.length)throw new Error('Live JS error after search: '+pageErrors.join(' | '));
          await page.evaluate(()=>resetFilters());
          await new Promise(resolve=>setTimeout(resolve,150));

          await page.click('.product-card [data-open]');
          await page.waitForSelector('#productDialog[open]',{timeout:5000});
          await page.$eval('[data-close-dialog]',el=>el.click());
          await new Promise(resolve=>setTimeout(resolve,150));

          await page.click('.product-card [data-add]');
          await page.click('#cartButton');
          await page.waitForSelector('#cartDialog[open] .checkout-actions a',{timeout:5000});
          await page.waitForFunction(p=>{
            const links=[...document.querySelectorAll('#cartDialog .checkout-actions a')];
            return links.some(a=>a.href.startsWith('https://wa.me/'+p))&&links.some(a=>a.href.startsWith('https://t.me/+'+p));
          },{},phone);
          const cartLinks=await page.$$eval('#cartDialog .checkout-actions a',nodes=>nodes.map(a=>({text:a.textContent.trim(),href:a.getAttribute('href')})));
          const wa=cartLinks.find(x=>/WhatsApp/i.test(x.text));
          const tg=cartLinks.find(x=>/Telegram/i.test(x.text));
          const mail=cartLinks.find(x=>/e-mail|email/i.test(x.text));
          if(!wa?.href?.startsWith(`https://wa.me/${phone}?text=`))throw new Error('Live cart WhatsApp target wrong: '+JSON.stringify(wa));
          if(!tg?.href?.startsWith(`https://t.me/+${phone}?text=`))throw new Error('Live cart Telegram target wrong: '+JSON.stringify(tg));
          if(!mail?.href?.startsWith(`mailto:${email}?`))throw new Error('Live cart email target wrong: '+JSON.stringify(mail));
          await page.$eval('[data-close-cart]',el=>el.click());

          await page.click('.delivery-payment-button');
          await page.waitForSelector('#deliveryDialog[open]',{timeout:5000});
          await page.$eval('#deliveryDialog button',el=>el.click());

          await page.evaluate(()=>{window.__opened=[];window.open=(url)=>{window.__opened.push(String(url));return null}});
          await page.click('#questionButton');
          await page.waitForSelector('#questionDialog[open]',{timeout:5000});
          await page.type('#questionText','Тестовый вопрос');
          await page.click('[data-question-channel="whatsapp"]');
          const qWa=await page.evaluate(()=>window.__opened.at(-1)||'');
          if(!qWa.startsWith(`https://wa.me/${phone}?text=`))throw new Error('Live question WhatsApp target wrong: '+qWa);
          await page.click('[data-question-channel="telegram"]');
          const qTg=await page.evaluate(()=>window.__opened.at(-1)||'');
          if(!qTg.startsWith(`https://t.me/+${phone}?text=`))throw new Error('Live question Telegram target wrong: '+qTg);

          if(!source.includes('`mailto:${CONTACT_EMAIL}?subject='))throw new Error('Live question email routing is not pinned to CONTACT_EMAIL');
          if(pageErrors.length)throw new Error('Live browser JS errors: '+pageErrors.join(' | '));
          await browser.close();
          console.log(JSON.stringify({productCount,cartLinks,qWa:qWa.slice(0,80),qTg:qTg.slice(0,80),questionEmail:email},null,2));
          NODE
