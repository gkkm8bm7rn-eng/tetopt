name: Temporary search polish
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-search-polish.py'
      - '.github/workflows/temp-search-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
      - name: Apply search polish
        run: python3 .tmp-search-polish.py
      - name: Validate search styles
        run: |
          grep -q 'FORMA SEARCH — white prominent field with magnifier' card-polish.css
          grep -q 'search-field::before' card-polish.css
          grep -q 'background:#fff!important' card-polish.css
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card-polish.css
          git diff --cached --quiet || git commit -m 'Make catalog search field white and prominent'
          git push origin HEAD:forma-atelier-zero-2026
