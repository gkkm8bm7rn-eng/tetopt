name: Audit first photo batch

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-photo-audit.trigger

permissions:
  contents: write

concurrency:
  group: audit-first-photo-batch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Audit unresolved products 12-20
        run: |
          python scripts/audit_product_photos.py \
            --catalog catalog-source.html \
            --hidden hidden-products.json \
            --ids 12-20 \
            --json data/photo-audit-12-20.json \
            --text data/photo-audit-12-20.txt

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-audit-12-20.json data/photo-audit-12-20.txt
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit product photos 12-20"
            git push
          fi
