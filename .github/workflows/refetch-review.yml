name: Refetch product photos for review

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-refetch-review.trigger

permissions:
  contents: write

concurrency:
  group: refetch-review
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow numpy opencv-python-headless

      - name: Repeat search for unresolved product 20
        run: |
          rm -rf data/refetch/20 data/refetch/review.json data/refetch/review.txt
          python scripts/refetch_for_review.py --source products.json --ids 20 --max-photos 12 --out data/refetch

      - name: Commit review candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refetch
          if git diff --cached --quiet; then
            echo "No refetch changes"
          else
            git commit -m "Repeat photo search for product 20"
            git push
          fi
