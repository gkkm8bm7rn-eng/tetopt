name: Performance optimize temp
on:
  push:
    branches: [performance-architecture-v1]
    paths: ['.github/workflows/performance-optimize-temp.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare image tools
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          (command -v magick || command -v convert)
      - name: Build lightweight catalog media
        run: |
          python3 scripts/build-card-media.py | tee /tmp/card-media-report.json
      - name: Consolidate runtime loading architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js'); s=p.read_text()
          replacements=[
            ("ASSET_BASE='https://gkkm8bm7rn-eng.github.io/tetopt/'", "ASSET_BASE='./'"),
            ("fetch(DATA_BASE+'catalog-index.json',{cache:'no-cache'}),fetch(DATA_BASE+'category-assignments.json',{cache:'no-cache'})", "fetch(DATA_BASE+'catalog-index.json'),fetch(DATA_BASE+'category-assignments.json')"),
            ("els.grid.innerHTML=list.map(cardTemplate).join('');", "els.grid.innerHTML=list.map((product,index)=>cardTemplate(product,index)).join('');"),
            ("if(p&&card&&String(p._selected)!==next){p._selected=next;card.outerHTML=cardTemplate(p)}", "if(p&&card&&String(p._selected)!==next){const cardIndex=card.parentElement?[...card.parentElement.children].indexOf(card):-1;p._selected=next;card.outerHTML=cardTemplate(p,cardIndex)}")
          ]
          for old,new in replacements:
            assert old in s, f'app.js target missing: {old[:80]}'
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('variants.js'); s=p.read_text()
          old="function cardTemplate(product){\n  let variant=axisVariant(product,currentVariant(product,product._selected));\n  product._selected=variant.sourceId;\n  const selectors=axisControls(product,variant,'card')||variantChoices(product,variant),sleepSize=sleepingSize(product,variant);"
          new="function cardTemplate(product,cardIndex=Number.POSITIVE_INFINITY){\n  let variant=axisVariant(product,currentVariant(product,product._selected));\n  product._selected=variant.sourceId;\n  const selectors=axisControls(product,variant,'card')||variantChoices(product,variant),sleepSize=sleepingSize(product,variant);\n  const mobile=window.matchMedia&&window.matchMedia('(max-width:640px)').matches,highCount=mobile?2:3,high=Number.isFinite(cardIndex)&&cardIndex>=0&&cardIndex<highCount;"
          assert old in s, 'variants.js cardTemplate header target missing'
          s=s.replace(old,new,1)
          old='<img src="${escapeAttr(imageUrl(variant.primaryImage))}" alt="${escapeAttr(stripModel(product.name))}" loading="lazy" decoding="async">'
          new='<img src="${escapeAttr(imageUrl(variant.primaryImage))}" alt="${escapeAttr(stripModel(product.name))}" loading="${high?\'eager\':\'lazy\'}" fetchpriority="${high?\'high\':\'low\'}" decoding="async">'
          assert old in s, 'variants.js card image target missing'
          s=s.replace(old,new,1)
          old="if(card)card.outerHTML=cardTemplate(product);"
          new="if(card){const cardIndex=card.parentElement?[...card.parentElement.children].indexOf(card):-1;card.outerHTML=cardTemplate(product,cardIndex)}"
          assert old in s, 'variants.js local axis target missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('cart-feedback.js'); s=p.read_text()
          start=s.index('/* Product media should come from the same Cloudflare-served origin')
          end=s.index('/* Header question shortcut.', start)
          registration="""/* Register the existing service worker without mutating image URLs or priorities at runtime.\n   Card media now uses same-origin relative URLs and declares loading priority in the card template itself. */\nif('serviceWorker' in navigator){\n  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(function(error){\n    console.warn('[service-worker] registration skipped',error);\n  });\n}\n\n"""
          s=s[:start]+registration+s[end:]
          assert 'prioritizeImages' not in s
          assert 'localizeMedia' not in s
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old='  <link rel="preconnect" href="https://gkkm8bm7rn-eng.github.io">\n'
          new='  <link rel="preload" href="./data/catalog-index.json" as="fetch" crossorigin="anonymous">\n  <link rel="preload" href="./data/category-assignments.json" as="fetch" crossorigin="anonymous">\n'
          assert old in s, 'index preconnect target missing'
          s=s.replace(old,new,1)
          old="""  const beacon = document.createElement('script');\n  beacon.type = 'module';\n  beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';\n  beacon.dataset.cfBeacon = JSON.stringify({\n    token: '59ed2c9fa549420491736b3635615cef',\n    spa: true,\n  });\n  document.head.appendChild(beacon);"""
          new="""  const loadBeacon = () => {\n    const beacon = document.createElement('script');\n    beacon.type = 'module';\n    beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';\n    beacon.dataset.cfBeacon = JSON.stringify({\n      token: '59ed2c9fa549420491736b3635615cef',\n      spa: true,\n    });\n    document.head.appendChild(beacon);\n  };\n  if (document.readyState === 'complete') window.setTimeout(loadBeacon, 0);\n  else window.addEventListener('load', loadBeacon, { once: true });"""
          assert old in s, 'analytics target missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Static integrity checks
        run: |
          node --check app.js
          node --check variants.js
          node --check cart-feedback.js
          node --check media-policy.js
          git diff --check
          python3 - <<'PY'
          import json, os, re
          d=json.load(open('data/catalog-index.json'))
          variants=[v for p in d['products'] for v in p['variants']]
          assert len(variants)==d['stats']['variants']
          missing=[v['primaryImage'] for v in variants if not os.path.exists(v['primaryImage'])]
          assert not missing, missing[:10]
          first=d['products'][:24]
          files=[p['variants'][0]['primaryImage'] for p in first]
          total=sum(os.path.getsize(f) for f in files)
          print('FIRST_PAGE_CARD_KB',round(total/1024))
          print('FIRST_PAGE_MAX_KB',round(max(os.path.getsize(f) for f in files)/1024))
          print('CARD_WEBP_COUNT',sum(1 for v in variants if v['primaryImage'].endswith('/card.webp')))
          app=open('app.js').read(); variants_js=open('variants.js').read(); cart=open('cart-feedback.js').read(); html=open('index.html').read()
          assert "ASSET_BASE='./'" in app
          assert "cache:'no-cache'" not in app
          assert 'list.map((product,index)=>cardTemplate(product,index))' in app
          assert 'fetchpriority="${high?' in variants_js
          assert 'prioritizeImages' not in cart and 'localizeMedia' not in cart
          assert html.count('rel="preload"')>=2
          assert "addEventListener('load', loadBeacon" in html
          PY
      - name: Install browser smoke-test dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Run functional and performance smoke test
        run: |
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';
          const chrome=execSync('which google-chrome || which chromium || which chromium-browser',{shell:'/bin/bash'}).toString().trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,deviceScaleFactor:2});
          await page.setCacheEnabled(false);
          await page.setBypassServiceWorker(true);
          const client=await page.target().createCDPSession();
          await client.send('Network.enable');
          await client.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:200*1024,uploadThroughput:94*1024,connectionType:'cellular3g'});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          const t0=Date.now();
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#productGrid .product-card',{timeout:60000});
          const firstReady=Date.now()-t0;
          const initial=await page.evaluate(()=>({cards:document.querySelectorAll('#productGrid .product-card').length,imgs:[...document.querySelectorAll('#productGrid img')].slice(0,6).map(i=>({loading:i.loading,priority:i.fetchPriority,src:i.getAttribute('src')}))}));
          if(initial.cards!==24) throw new Error('Expected 24 catalog cards, got '+initial.cards);
          if(initial.imgs[0].loading!=='eager'||initial.imgs[1].loading!=='eager'||initial.imgs[2].loading!=='lazy') throw new Error('Mobile image priority policy mismatch '+JSON.stringify(initial.imgs.slice(0,3)));
          if(!initial.imgs.some(x=>/card\.webp$/.test(x.src))) throw new Error('Optimized card images are not used');

          // Search and reset.
          await page.type('#searchInput','Амура');
          await page.click('.search-submit');
          await page.waitForFunction(()=>document.querySelectorAll('#productGrid .product-card').length>=1);
          await page.click('#clearFilters');
          await page.waitForFunction(()=>document.querySelectorAll('#productGrid .product-card').length===24);

          // Sort.
          await page.select('#sortSelect','price-asc');
          await new Promise(r=>setTimeout(r,100));

          // Category control.
          const category=await page.$('[data-main-category="interior"]');
          if(category){await category.click();await new Promise(r=>setTimeout(r,100));}

          // Restore all products through mobile reset if present, otherwise direct all-category control.
          const reset=await page.$('[data-reset-all-products]');
          if(reset){await reset.click();await new Promise(r=>setTimeout(r,100));}

          // Favorite and cart on first card.
          await page.click('#productGrid .product-card button[data-favorite]');
          await page.click('#productGrid .product-card button[data-add]');
          const cartCount=await page.$eval('#cartCount',el=>Number(el.textContent)||0).catch(()=>0);
          if(cartCount<1) throw new Error('Cart did not update');

          // Open product detail and close it.
          await page.click('#productGrid .product-card .product-image-stage');
          await page.waitForSelector('#productDialog[open] .detail',{timeout:15000});
          const detailMain=await page.$eval('#galleryMain',i=>i.getAttribute('src'));
          if(/\/card\.webp$/.test(detailMain)) throw new Error('Detail gallery incorrectly uses card thumbnail');
          await page.click('[data-close-dialog]');
          await page.waitForFunction(()=>!document.querySelector('#productDialog').open);

          // Variant click should not rebuild neighboring cards.
          const variantResult=await page.evaluate(async()=>{
            const card=[...document.querySelectorAll('#productGrid .product-card')].find(c=>c.querySelector('[data-card-variant]'));
            if(!card)return {skipped:true};
            const neighbor=card.nextElementSibling||card.previousElementSibling;
            const neighborRef=neighbor;
            const options=[...card.querySelectorAll('[data-card-variant]')];
            const active=options.findIndex(x=>x.classList.contains('active'));
            const target=options.find((_,i)=>i!==active)||options[0];
            target.click();
            await new Promise(r=>setTimeout(r,100));
            return {skipped:false,neighborStable:neighborRef===neighbor,cardCount:document.querySelectorAll('#productGrid .product-card').length};
          });
          if(!variantResult.skipped&&(!variantResult.neighborStable||variantResult.cardCount!==24)) throw new Error('Variant local render regression '+JSON.stringify(variantResult));

          const resources=await page.evaluate(()=>performance.getEntriesByType('resource').filter(e=>e.initiatorType==='img').map(e=>({name:e.name,transferSize:e.transferSize,duration:e.duration})).sort((a,b)=>b.transferSize-a.transferSize).slice(0,10));
          console.log('SMOKE',JSON.stringify({firstReady,initial,variantResult,largestImages:resources,errors},null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE
      - name: Final architecture audit and commit
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          d=json.load(open('data/catalog-index.json'))
          first=d['products'][:24]
          total=sum(os.path.getsize(p['variants'][0]['primaryImage']) for p in first)
          assert total < 1200*1024, f'first-page media still too heavy: {total/1024:.0f} KB'
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          runtime=[x for x in changed if x in {'app.js','variants.js','cart-feedback.js','index.html','sw.js','media-policy.js'}]
          assert 'sw.js' not in runtime
          assert 'media-policy.js' not in runtime
          print('RUNTIME_FILES',runtime)
          print('CHANGED_FILES',len(changed))
          PY
          git rm .github/workflows/performance-optimize-temp.yml
          git config user.name 'FORMA performance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js variants.js cart-feedback.js index.html data/catalog-index.json scripts/build-card-media.py assets/products
          git add -u .github/workflows/performance-optimize-temp.yml
          git commit -m 'Optimize catalog loading architecture'
          git push origin HEAD:performance-architecture-v1
