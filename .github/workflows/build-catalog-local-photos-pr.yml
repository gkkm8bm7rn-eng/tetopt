name: Build catalog JSON with local photos

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_catalog_local_photos.py'
      - 'tools/catalog-grouping-blueprint.b64'
      - '.github/workflows/build-catalog-local-photos-pr.yml'
      - 'catalog-source.html'
      - 'data/confirmed-photo-release-batch-*.json'
      - 'assets/products/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build JSON
        run: python tools/build_catalog_local_photos.py
      - name: Show audit
        run: cat review-output/catalog-local-photos-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-local-photos
          path: review-output/catalog-local-photos*.json
          retention-days: 1
