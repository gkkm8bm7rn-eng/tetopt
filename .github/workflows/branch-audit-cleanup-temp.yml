name: Temporary branch audit cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-audit-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary branches
        run: |
          git push origin --delete __temp_dummy_never_use branch-audit-temp-trigger branch-audit-temp-trigger-2 || true
      - name: Remove temporary audit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/branch-audit-temp.yml .github/workflows/branch-audit-cleanup-temp.yml data/branch-audit.json
          git commit -m 'Remove temporary branch audit artifacts'
          git push origin HEAD:main
