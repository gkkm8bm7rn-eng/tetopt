name: Public next browser smoke

on:
  pull_request:
    paths:
      - 'next/**'
      - 'catalog.json'
      - 'scripts/e2e-public-next.mjs'
      - '.github/workflows/public-next-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
      NEXT_BASE_URL: https://tetopt.m78m6cfc2v.workers.dev/next/
      NEXT_E2E_OUT: artifacts/public-next-${{ matrix.engine }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate smoke script
        run: node --check scripts/e2e-public-next.mjs

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser checks against public staging
        run: node scripts/e2e-public-next.mjs

      - name: Upload public staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-next-${{ matrix.engine }}-results
          path: artifacts/public-next-${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 7
