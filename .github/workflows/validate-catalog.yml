name: Validate catalog integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/products/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/products/**'
      - 'scripts/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog/index/detail/media integrity
        run: python scripts/validate-catalog.py
