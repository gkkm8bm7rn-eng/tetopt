name: Performance A/B QA temp

on:
  push:
    branches: [performance-architecture-v1]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare identical local origins and candidate priority policy
        run: |
          git fetch origin main
          git worktree add /tmp/tetopt-main origin/main
          python3 - <<'PY'
          from pathlib import Path
          asset_old="ASSET_BASE='https://gkkm8bm7rn-eng.github.io/tetopt/'"
          for path in [Path('app.js'), Path('/tmp/tetopt-main/app.js')]:
              text=path.read_text()
              assert asset_old in text, path
              path.write_text(text.replace(asset_old,"ASSET_BASE='./'",1))
          path=Path('variants.js')
          text=path.read_text()
          old='${high?\' fetchpriority="high"\':\'\'}'
          new=' fetchpriority="${high?\'high\':\'low\'}"'
          assert old in text
          path.write_text(text.replace(old,new,1))
          PY
      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Run fair throttled A/B comparison
        run: |
          python3 -m http.server 8000 --directory /tmp/tetopt-main >/tmp/main-server.log 2>&1 &
          python3 -m http.server 8001 --directory "$GITHUB_WORKSPACE" >/tmp/candidate-server.log 2>&1 &
          sleep 2
          node scripts/_performance_fair_temp.mjs
