name: Audit photo batch 02

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-photo-audit-batch-02.trigger

permissions:
  contents: write

concurrency:
  group: audit-photo-batch-02
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Audit active products in batch 02
        run: |
          python scripts/audit_product_photos.py \
            --catalog catalog-source.html \
            --hidden hidden-products.json \
            --ids 21,28,29,30,31,32,33,34,36,41,45,50,51,52,56,57,62,63,64,65 \
            --json data/photo-audit-batch-02.json \
            --text data/photo-audit-batch-02.txt

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-audit-batch-02.json data/photo-audit-batch-02.txt
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit photo batch 02"
            git push
          fi
