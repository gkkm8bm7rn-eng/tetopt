name: Fetch high-resolution photos for product 20

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-fetch-product20-retailer.trigger

permissions:
  contents: write

concurrency:
  group: fetch-product20-retailer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless

      - name: Download exact product 21794 photos
        run: |
          rm -rf data/retailer/20
          python scripts/fetch_product20_retailer.py

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retailer/20
          if git diff --cached --quiet; then
            echo "No retailer candidates"
          else
            git commit -m "Fetch exact photos for product 20"
            git push
          fi
