name: Full visual audit
on:
  push:
    branches: [visual-audit-20260908]
    paths: [.github/workflows/full-visual-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Audit hero and product dialog
        run: |
          python3 -m http.server 8000 >/tmp/forma-http.log 2>&1 &
          cat > /tmp/visual-audit.js <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{name:'mobile-390',width:390,height:1100},{name:'desktop-1440',width:1440,height:1200}];
            fs.mkdirSync('visual-audit',{recursive:true});
            const report=[];
            for(const c of cases){
              const page=await browser.newPage({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(2200);
              const base=await page.evaluate(()=>{
                const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));
                const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect();return{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1)}};
                const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&rect(el)?.w>0;
                const hero=q('.hero'), eyebrow=q('.hero .eyebrow'), title=q('#heroTitle');
                const allRow=qa('.mobile-category-trigger').find(el=>(el.textContent||'').includes('Все товары'));
                const filter=q('#filterToggle'), sortIcon=q('.sort-icon');
                return {
                  innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  heroRect:rect(hero),
                  eyebrowText:(eyebrow?.textContent||'').trim(),
                  eyebrowVisible:visible(eyebrow),
                  heroTitleText:(title?.textContent||'').replace(/\s+/g,' ').trim(),
                  heroTitleVisible:visible(title),
                  heroTitleRect:rect(title),
                  allProductsVisible:visible(allRow),
                  allProductsText:(allRow?.textContent||'').replace(/\s+/g,' ').trim(),
                  filterText:(filter?.textContent||'').replace(/\s+/g,' ').trim(),
                  sortGlyphText:(sortIcon?.textContent||'').trim(),
                  sortGlyphFontSize:sortIcon?getComputedStyle(sortIcon).fontSize:null,
                  productCards:qa('.product-card').length
                };
              });
              let productModal=null;
              const firstName=page.locator('.product-card .product-name').first();
              if(await firstName.count()){
                await firstName.click();
                await page.waitForTimeout(250);
                productModal=await page.evaluate(()=>{
                  const d=document.querySelector('#productDetail,.product-dialog');
                  const close=d&&d.querySelector('[data-close-detail],.detail-close,.product-close,[aria-label="Закрыть"]');
                  const r=d?.getBoundingClientRect(), cr=close?.getBoundingClientRect();
                  return {open:!!(d&&(d.open||d.hasAttribute('open'))),dialogRect:r?{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}:null,closeRect:cr?{x:+cr.x.toFixed(1),y:+cr.y.toFixed(1),w:+cr.width.toFixed(1),h:+cr.height.toFixed(1)}:null,closeText:(close?.textContent||'').trim(),closeAria:close?.getAttribute('aria-label')||null};
                });
                await page.screenshot({path:`visual-audit/${c.name}-product-modal.png`,fullPage:false});
              }
              report.push({case:c,...base,productModal});
              await page.close();
            }
            fs.writeFileSync('visual-audit/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/visual-audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: full-visual-audit
          path: visual-audit
