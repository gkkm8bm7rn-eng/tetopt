name: Full visual audit
on:
  push:
    branches: [visual-audit-20260908]
    paths: [.github/workflows/full-visual-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-hero-compact-fix-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Smoke-test current interactions
        run: |
          python3 -m http.server 8000 >/tmp/forma-http.log 2>&1 &
          cat > /tmp/smoke.js <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [390,768,1440]){
              const page=await browser.newPage({viewport:{width,height:1100},deviceScaleFactor:1});
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1800);
              const metrics=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,heroH:document.querySelector('.hero')?.getBoundingClientRect().height||0,titleDisplay:getComputedStyle(document.querySelector('#heroTitle')).display,cardCount:document.querySelectorAll('.product-card').length}));
              if(metrics.scrollWidth>metrics.innerWidth) throw new Error(`horizontal overflow ${width}: ${metrics.scrollWidth}>${metrics.innerWidth}`);
              if(width>640 && (metrics.heroH>90 || metrics.titleDisplay!=='none')) throw new Error(`desktop hero mismatch ${width}: ${JSON.stringify(metrics)}`);
              if(metrics.cardCount<1) throw new Error(`catalog missing at ${width}`);

              const q=page.locator('#questionButton');
              await q.click();
              if(!(await page.locator('#questionDialog').evaluate(d=>d.open))) throw new Error(`question dialog failed ${width}`);
              await page.keyboard.press('Escape');

              const delivery=page.locator('.delivery-payment-button');
              await delivery.click();
              const deliveryOpen=await page.locator('#deliveryDialog').evaluate(d=>d.open);
              if(!deliveryOpen) throw new Error(`delivery dialog failed ${width}`);
              await page.keyboard.press('Escape');

              if(width<=640){
                const horeca=page.locator('.mobile-category-trigger[data-mobile-category-toggle="horeca"]');
                await horeca.click();
                await page.waitForTimeout(180);
                const selected=await horeca.evaluate(el=>{const icon=el.querySelector('.mobile-category-icon');const sec=el.closest('.mobile-category-section');return{open:sec?.classList.contains('open'),bg:getComputedStyle(icon).backgroundImage}});
                if(!selected.open || !selected.bg || selected.bg==='none') throw new Error(`mobile category/icon failed ${width}: ${JSON.stringify(selected)}`);
              }else{
                const filter=page.locator('#filterToggle');
                await filter.click();
                const shown=await page.locator('#filters').evaluate(el=>getComputedStyle(el).display!=='none');
                if(!shown) throw new Error(`filters failed ${width}`);
              }

              const firstName=page.locator('.product-card .product-name').first();
              await firstName.click();
              await page.waitForTimeout(180);
              const detailOpen=await page.locator('#productDetail').evaluate(d=>!!(d.open||d.hasAttribute('open')));
              if(!detailOpen) throw new Error(`product detail failed ${width}`);
              await page.keyboard.press('Escape');
              if(pageErrors.length) throw new Error(`page errors ${width}: ${pageErrors.join(' | ')}`);
              console.log(JSON.stringify({width,metrics,ok:true}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.js
