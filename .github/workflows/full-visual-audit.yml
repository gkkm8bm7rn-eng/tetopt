name: Full visual audit
on:
  push:
    branches: [visual-audit-20260908]
    paths: [.github/workflows/full-visual-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-hero-compact-fix-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Audit compact hero candidate
        run: |
          python3 -m http.server 8000 >/tmp/forma-http.log 2>&1 &
          cat > /tmp/visual-audit.js <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'mobile-390',width:390,height:1100},
              {name:'tablet-768',width:768,height:1100},
              {name:'desktop-1024',width:1024,height:1100},
              {name:'desktop-1440',width:1440,height:1200}
            ];
            fs.mkdirSync('visual-audit',{recursive:true});
            const report=[];
            for(const c of cases){
              const page=await browser.newPage({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(2200);
              const data=await page.evaluate(()=>{
                const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));
                const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect();return{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1)}};
                const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&rect(el)?.w>0;
                const hero=q('.hero'), content=q('.hero-content'), eyebrow=q('.hero .eyebrow'), title=q('#heroTitle');
                const catalog=q('.catalog-section'), heading=q('.catalog-section>.section-heading'), tools=q('.catalog-tools'), grid=q('#productGrid');
                const actions=q('.site-header .header-actions'), cart=q('#cartButton');
                const allRow=qa('.mobile-category-trigger').find(el=>(el.textContent||'').includes('Все товары'));
                return {
                  innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  hero:rect(hero),heroContent:rect(content),
                  eyebrowText:(eyebrow?.textContent||'').trim(),eyebrowVisible:visible(eyebrow),
                  titleText:(title?.textContent||'').replace(/\s+/g,' ').trim(),titleVisible:visible(title),
                  heading:rect(heading),tools:rect(tools),catalog:rect(catalog),grid:rect(grid),
                  headerActions:rect(actions),cart:rect(cart),
                  allProductsVisible:visible(allRow),
                  productCards:qa('.product-card').length,
                  firstCard:rect(q('.product-card')),
                  bodyBg:getComputedStyle(document.body).backgroundImage
                };
              });
              report.push({case:c,...data});
              await page.screenshot({path:`visual-audit/${c.name}-top.png`,fullPage:false});
              await page.close();
            }
            fs.writeFileSync('visual-audit/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/visual-audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: full-visual-audit
          path: visual-audit
