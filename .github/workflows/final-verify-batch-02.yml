name: Final verify batch 02

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-final-verify-batch-02.trigger

permissions:
  contents: write

concurrency:
  group: final-verify-batch-02
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare final first-photo order and cache version
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path

          catalog = Path('catalog-source.html')
          html = catalog.read_text(encoding='utf-8')
          marker = '    const PRODUCTS = '
          start = html.index(marker) + len(marker)
          end = html.index(';\n', start)
          products = json.loads(html[start:end])
          changed = False
          for product in products:
              if int(product.get('id', 0)) != 65:
                  continue
              images = [str(x) for x in product.get('images', []) if x]
              preferred = 'assets/products/65/02.webp'
              if preferred in images:
                  ordered = [preferred] + [x for x in images if x != preferred]
                  if ordered != images or product.get('directImage') != preferred:
                      product['images'] = ordered
                      product['directImage'] = preferred
                      changed = True
          if changed:
              catalog.write_text(html[:start] + json.dumps(products, ensure_ascii=False, separators=(',', ':')) + html[end:], encoding='utf-8')

          loader = Path('catalog-loader.js')
          loader_text = loader.read_text(encoding='utf-8')
          current = re.search(r'const assetVersion="([^"]+)";', loader_text)
          if not current:
              raise RuntimeError('assetVersion not found')
          version = current.group(1)
          if not version.endswith('-b02-final'):
              version = datetime.now(timezone.utc).strftime('%Y%m%d-%H%M-b02-final')
              loader_text, count = re.subn(r'const assetVersion="[^"]+";', f'const assetVersion="{version}";', loader_text, count=1)
              if count != 1:
                  raise RuntimeError('assetVersion not replaced')
              loader.write_text(loader_text, encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          index_text, count = re.subn(r'catalog-loader\.js\?v=\d+', 'catalog-loader.js?v=15', index_text, count=1)
          if count != 1:
              raise RuntimeError('loader version not found')
          index.write_text(index_text, encoding='utf-8')

          Path('data/batch-02-final-preparation.json').write_text(json.dumps({
              'batch': 2,
              'preparedAt': datetime.now(timezone.utc).isoformat(),
              'assetVersion': version,
              'id65FirstPhoto': 'assets/products/65/02.webp',
              'reason': 'Доп.фото 2 имеет более высокий показатель полного вида товара (80.54 против 44.62 у основного фото).'
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Publish preparation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html catalog-loader.js index.html data/batch-02-final-preparation.json
          if git diff --cached --quiet; then
            echo "No preparation changes"
          else
            git commit -m "Подготовить вторую партию к окончательной проверке"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser verification tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify 20 products on GitHub Pages and Cloudflare
        id: live_verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p data
          node scripts/final_verify_batch_02.mjs 2>&1 | tee data/batch-02-final-verification.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path('data/batch-02-final-verification.log').read_text(encoding='utf-8', errors='replace')
          Path('data/batch-02-final-verification-error.json').write_text(json.dumps({
              'batch': 2,
              'status': 'failed',
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'errorLog': log[-12000:]
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          fi
          exit 0

      - name: Mark batch 02 complete only after passed verification
        if: steps.live_verify.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          batch_ids = [21,28,29,30,31,32,33,34,36,41,45,50,51,52,56,57,62,63,64,65]
          report_path = Path('data/batch-02-final-verification.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status') != 'passed' or report.get('completedCount') != len(batch_ids):
              raise RuntimeError('Final verification did not pass')

          progress_path = Path('photo-processing-progress.json')
          progress = json.loads(progress_path.read_text(encoding='utf-8'))
          progress['version'] = int(progress.get('version', 0)) + 1
          progress['updatedAt'] = datetime.now(timezone.utc).isoformat()
          progress['reviewedIds'] = sorted(set(map(int, progress.get('reviewedIds', []))) | set(batch_ids))
          progress['completedIds'] = sorted(set(map(int, progress.get('completedIds', []))) | set(batch_ids))
          progress['manualReviewIds'] = sorted(set(map(int, progress.get('manualReviewIds', []))) - set(batch_ids))
          progress['lastBatch'] = 2
          progress['lastBatchIds'] = batch_ids
          progress['lastBatchStatus'] = 'completed_live_verified'
          progress['completedCount'] = len(progress['completedIds'])
          progress_path.write_text(json.dumps(progress, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          apply_path = Path('data/batch-02-exact-apply-report.json')
          if apply_path.exists():
              applied = json.loads(apply_path.read_text(encoding='utf-8'))
              applied['status'] = 'completed_live_verified'
              applied['verifiedAt'] = datetime.now(timezone.utc).isoformat()
              applied['verifiedSites'] = ['github-pages', 'cloudflare']
              apply_path.write_text(json.dumps(applied, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit final verification evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/batch-02-final-verification.json data/batch-02-final-verification.log data/batch-02-final-verification-error.json data/live-review-batch-02 photo-processing-progress.json data/batch-02-exact-apply-report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification evidence changes"
          else
            if [ "${{ steps.live_verify.outputs.exit_code }}" = "0" ]; then
              git commit -m "Завершить окончательную проверку второй партии"
            else
              git commit -m "Зафиксировать ошибку окончательной проверки второй партии"
            fi
            git pull --rebase origin main
            git push
          fi

      - name: Fail workflow if live verification failed
        if: steps.live_verify.outputs.exit_code != '0'
        run: exit 1
