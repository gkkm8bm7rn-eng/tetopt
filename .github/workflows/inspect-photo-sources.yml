name: Inspect product photo sources

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-inspect-photo-sources.trigger

permissions:
  contents: write

concurrency:
  group: inspect-photo-sources
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Inspect product 20 source files
        run: |
          python scripts/inspect_photo_sources.py \
            --source data/source-products-12-20.json \
            --id 20 \
            --out data/photo-sources-20.json

      - name: Commit source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-sources-20.json data/photo-sources-20.txt
          if git diff --cached --quiet; then
            echo "No source report changes"
          else
            git commit -m "Inspect photo sources for product 20"
            git push
          fi
