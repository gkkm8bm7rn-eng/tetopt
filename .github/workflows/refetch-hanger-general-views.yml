name: Refetch hanger general views

on:
  workflow_dispatch:
  push:
    paths:
      - "data/run-refetch-hanger-general-views.txt"

permissions:
  contents: write

concurrency:
  group: refetch-hanger-general-views
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow numpy

      - name: Repeat supplier search and choose full-product views
        run: python scripts/refetch_hanger_general_views.py

      - name: Validate first-image rule for processed hangers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('data/hanger-refetch-report.json').read_text(encoding='utf-8'))
          for item in report['processed']:
              metrics=item['primary_metrics']
              assert metrics['confident_general_view'] is True
              assert metrics['vertical_coverage'] >= 0.70
              assert metrics['object_aspect'] >= 1.35
              for saved in item['saved']:
                  assert Path(saved['path']).is_file()
                  w,h=map(int,saved['size'].split('x'))
                  assert min(w,h) >= 500
          print(f"Validated {len(report['processed'])} updated hanger galleries")
          if report['manual_review']:
              print(f"Manual review required: {len(report['manual_review'])}")
          PY

      - name: Commit verified changes
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html assets/products data/hanger-refetch-report.json
          git commit -m "Исправить первые фотографии вешалок после повторного поиска"
          git push origin "HEAD:${GITHUB_REF_NAME}"
