name: Temporary root favorite fix

on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-favorite-root-fix.py'
      - '.github/workflows/temp-fix-favorite-root.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Apply root fix
        run: python .tmp-favorite-root-fix.py
      - name: Validate
        run: |
          node --check app.js
          grep -q 'position:absolute!important;z-index:6!important;right:10px!important;left:auto!important' card-polish.css
          grep -q 'toggleFavorite(b.dataset.favorite);return}if(b.dataset.open)' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-polish.css app.js
          git commit -m "Fix Atelier favorite position and direct catalog toggle"
          git push origin HEAD:forma-atelier-zero-2026
