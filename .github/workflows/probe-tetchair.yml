name: Apply Tetchair computer-chair media
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.issue.title == '[media-apply] Tetchair computer chairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Enrich one verified batch
        run: python scripts/enrich-computer-chair-media.py --apply --batch-index "${{ github.event.issue.body }}" --batch-size 12 || true
      - name: Commit batch
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products data/details data/computer-chair-photo-audit.json
          if git diff --cached --quiet; then echo 'No changes in this batch'; exit 0; fi
          git commit -m "Enrich computer chair photos batch ${{ github.event.issue.body }}"
          git pull --rebase origin main
          git push origin HEAD:main
