name: Probe Tetchair photobank
on:
  push:
    paths:
      - '.github/workflows/probe-tetchair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe supplier photobank
        shell: python
        run: |
          import io, json, zipfile, urllib.request
          url='https://price.tetchair.ru/download_photo/?id=19295&with_info=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 FORMA-HOME-media-audit'})
          with urllib.request.urlopen(req,timeout=30) as response:
              body=response.read()
              print('status',response.status,'type',response.headers.get('content-type'),'bytes',len(body),'final',response.geturl())
          z=zipfile.ZipFile(io.BytesIO(body))
          print('files',len(z.infolist()))
          for item in z.infolist():
              if not item.is_dir(): print(json.dumps({'name':item.filename,'size':item.file_size},ensure_ascii=False))
