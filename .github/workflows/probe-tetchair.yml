name: Probe Tetchair photobank
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.issue.title == '[media-probe] Tetchair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe supplier photobank
        shell: python
        run: |
          import io, json, zipfile, urllib.request, pathlib
          url='https://price.tetchair.ru/download_photo/?id=19295&with_info=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 FORMA-HOME-media-audit'})
          with urllib.request.urlopen(req,timeout=30) as response:
              body=response.read()
              result={'status':response.status,'contentType':response.headers.get('content-type'),'bytes':len(body),'finalUrl':response.geturl()}
          z=zipfile.ZipFile(io.BytesIO(body))
          result['files']=[{'name':item.filename,'size':item.file_size} for item in z.infolist() if not item.is_dir()]
          pathlib.Path('data/tetchair-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Commit probe result
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tetchair-probe.json
          git commit -m 'Record Tetchair photobank probe' || exit 0
          git push origin HEAD:main
