name: Audit Tetchair computer-chair media
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  audit:
    if: github.event.issue.title == '[media-audit] Tetchair computer chairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Match catalog variants to Tetchair photobank
        run: python scripts/enrich-computer-chair-media.py
      - name: Commit audit
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/computer-chair-photo-audit.json
          git commit -m 'Audit computer chair photobank matches' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
