name: Audit batch 03

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data/run-batch-03-audit.trigger

permissions:
  contents: write

concurrency:
  group: audit-batch-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Audit next 20 active products
        run: |
          python scripts/audit_product_photos.py \
            --ids "67,69,70,71,72,73,74,75,77,78,79,80,81,87,88,89,90,91,93,94" \
            --json data/photo-audit-batch-03.json \
            --text data/photo-audit-batch-03.txt

      - name: Record batch as in progress
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          batch_ids = [67,69,70,71,72,73,74,75,77,78,79,80,81,87,88,89,90,91,93,94]
          report = json.loads(Path('data/photo-audit-batch-03.json').read_text(encoding='utf-8'))
          unresolved = [int(item['id']) for item in report.get('products', []) if item.get('manual_review')]
          path = Path('photo-processing-progress.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = int(data.get('version', 0)) + 1
          data['updatedAt'] = datetime.now(timezone.utc).isoformat()
          data['inProgressBatch'] = 3
          data['inProgressBatchIds'] = batch_ids
          data['unresolvedIds'] = unresolved
          data['lastBatchStatus'] = 'batch_03_audit_completed_pending_curation'
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(json.dumps({'batch': 3, 'ids': batch_ids, 'unresolved': unresolved}, ensure_ascii=False))
          PY

      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/photo-audit-batch-03.json data/photo-audit-batch-03.txt photo-processing-progress.json
          git commit -m "Провести аудит третьей партии товаров"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
