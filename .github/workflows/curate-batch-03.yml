name: Curate batch 03

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data/run-batch-03-curation.trigger

permissions:
  contents: write

concurrency:
  group: curate-batch-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply conservative curation
        run: python scripts/apply_batch_03_curation.py

      - name: Validate JavaScript
        run: node --check catalog-loader.js

      - name: Commit curated galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog-source.html catalog-loader.js index.html photo-processing-progress.json data/batch-03-curation-report.json
          git commit -m "Применить проверенный порядок фото третьей партии"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
