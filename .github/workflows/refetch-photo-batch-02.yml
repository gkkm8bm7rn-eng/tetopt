name: Refetch unresolved photos in batch 02

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-refetch-batch-02.trigger

permissions:
  contents: write

concurrency:
  group: refetch-photo-batch-02
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow numpy opencv-python-headless

      - name: Repeat search for low-resolution, blurred or cropped products
        run: |
          rm -rf data/refetch-batch-02
          python scripts/refetch_for_review.py \
            --source data/source-products-batch-02.json \
            --ids 28,30,31,34,41,45,51,52,56,57,63,65 \
            --max-photos 12 \
            --max-side 1800 \
            --max-kb 480 \
            --out data/refetch-batch-02

      - name: Commit review candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refetch-batch-02
          if git diff --cached --quiet; then
            echo "No refetch changes"
          else
            git commit -m "Refetch unresolved photos for batch 02"
            git push
          fi
