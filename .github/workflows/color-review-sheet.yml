name: Generate color review sheet

on:
  push:
    branches:
      - agent/color-review-sheets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build second review sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_color_review_sheet.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'confirmed = {1,2,3,4,5,6,7,8,10,11,19,20,21,22,23,24,25,26,27}',
              'confirmed = {1,2,3,4,5,6,7,8,10,11,19,20,21,22,23,24,25,26,27,30,31,32,33,51,52,63,64,69,70,71,72}'
          )
          text = text.replace('партия 1', 'партия 2')
          text = text.replace('color-review-batch-01', 'color-review-batch-02')
          path.write_text(text, encoding='utf-8')
          PY
          python tools/build_color_review_sheet.py
      - name: Upload review sheet
        uses: actions/upload-artifact@v4
        with:
          name: color-review-batch-02
          path: review-output/
          retention-days: 1
