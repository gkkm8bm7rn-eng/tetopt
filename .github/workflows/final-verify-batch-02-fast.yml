name: Final verify batch 02 fast

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-final-verify-batch-02-fast.trigger

permissions:
  contents: write

concurrency:
  group: final-verify-batch-02-fast
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image and HTTP checks
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Run final publication verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/final_verify_batch_02_fast.py 2>&1 | tee data/batch-02-final-verification-fast.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/batch-02-final-verification.json data/batch-02-final-verification-error.json data/batch-02-final-verification-fast.log photo-processing-progress.json data/batch-02-exact-apply-report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No final verification changes"
          else
            if [ "${{ steps.verify.outputs.exit_code }}" = "0" ]; then
              git commit -m "Завершить окончательную проверку второй партии"
            else
              git commit -m "Зафиксировать ошибку финального контроля второй партии"
            fi
            git pull --rebase origin main
            git push
          fi

      - name: Fail if final check failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
