name: Review supplier main photos

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/review-supplier-main-photos.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: agent/front-three-quarter-and-image-zoom

      - name: Install image tools
        run: python -m pip install --quiet pillow requests

      - name: Download designated supplier main photos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import io, json, requests, zipfile

          ITEMS = [
            (493,26023,'Амура — бежевый'),(896,25435,'Осло — горчичный'),
            (189,24554,'Синди Софт — бежевый'),(136,24914,'Бари полубарный — бежевый'),
            (70,21177,'Фокс — мрамор'),(1477,25642,'Селин — черная'),
            (33,19252,'Гленд — черный'),(656,20437,'Чавари — золотой'),
            (843,25842,'Диван Чарли Люкс — бежевый'),(1182,25661,'Нордик — черный'),
            (298,25405,'Луц — серый'),(894,25433,'Осло — серый'),
            (899,25506,'Рефлекс с пуфом — светло-серый'),(908,25118,'Пуф Чарли — серый'),
            (893,25718,'Агнет — светло-бежевый'),(863,25122,'Банкетка Чарли — какао'),
            (855,25273,'Космо — бежевый'),(307,25707,'Монклер — бежевый'),
          ]
          out=Path('supplier-main-photo-review'); out.mkdir(exist_ok=True)
          session=requests.Session(); session.headers['User-Agent']='Mozilla/5.0'
          font=ImageFont.load_default(); records=[]
          cell_w,cell_h=480,440
          sheet=Image.new('RGB',(cell_w*3,cell_h*6),'white')
          draw=ImageDraw.Draw(sheet)

          for index,(product_id,code,title) in enumerate(ITEMS):
            row={'id':product_id,'code':code,'title':title,'archiveMembers':[],'selected':None,'error':None}
            rr,cc=divmod(index,3); x0,y0=cc*cell_w,rr*cell_h
            draw.rectangle((x0,y0,x0+cell_w-1,y0+cell_h-1),outline='black',width=2)
            draw.text((x0+8,y0+7),f'ID {product_id} / {code} — {title}',fill='black',font=font)
            try:
              response=session.get(f'https://price.tetchair.ru/download_photo/?id={code}',timeout=90)
              response.raise_for_status()
              if not zipfile.is_zipfile(io.BytesIO(response.content)):
                raise ValueError('supplier response is not a ZIP archive')
              candidates=[]
              with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                for info in archive.infolist():
                  if info.is_dir() or not info.filename.lower().endswith(('.jpg','.jpeg','.png','.webp')):
                    continue
                  name=Path(info.filename).name
                  low=name.casefold()
                  data=archive.read(info)
                  try:
                    with Image.open(io.BytesIO(data)) as image:
                      image.load(); width,height=image.size
                  except Exception:
                    continue
                  row['archiveMembers'].append({'name':name,'width':width,'height':height})
                  main_score=0
                  if 'основ' in low: main_score+=100
                  if 'main' in low or 'primary' in low: main_score+=90
                  if 'главн' in low: main_score+=80
                  if main_score:
                    candidates.append((main_score,width*height,name,data,width,height))
              if not candidates:
                raise ValueError('archive has no designated main photo')
              candidates.sort(reverse=True)
              _,_,name,data,width,height=candidates[0]
              row['selected']={'name':name,'width':width,'height':height}
              with Image.open(io.BytesIO(data)) as image:
                image=image.convert('RGB')
                image.thumbnail((cell_w-24,cell_h-76),Image.Resampling.LANCZOS)
                sheet.paste(image,(x0+(cell_w-image.width)//2,y0+54+(cell_h-66-image.height)//2))
              draw.text((x0+8,y0+26),f'MAIN: {name} ({width}x{height})',fill='black',font=font)
            except Exception as exc:
              row['error']=f'{type(exc).__name__}: {exc}'
              draw.text((x0+8,y0+60),row['error'][:72],fill='black',font=font)
            records.append(row)

          sheet.save(out/'supplier-main-photos.jpg',quality=94)
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload supplier main-photo review
        uses: actions/upload-artifact@v4
        with:
          name: supplier-main-photo-review
          path: supplier-main-photo-review
