name: Temporary real image favorites
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-favorite-real-img.py'
      - '.github/workflows/temp-real-img-favorites.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - name: Apply real image favorite renderer
        run: python .tmp-favorite-real-img.py
      - name: Validate
        run: |
          node --check app.js
          grep -q "function syncHeaderFavoriteIcon" app.js
          grep -q "favorite-icon-image" app.js
          grep -q "favorite-icon-image" card-polish.css
          grep -q "button\[data-favorite\]::before,button\[data-favorite\]::after{content:none!important" card-polish.css
          test -f assets/ui/favorite-inactive.png
          test -f assets/ui/favorite-active.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js card-polish.css
          git commit -m "Render Atelier favorites as real image elements"
          git push origin HEAD:forma-atelier-zero-2026
