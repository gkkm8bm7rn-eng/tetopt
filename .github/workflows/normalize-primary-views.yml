name: Normalize catalog primary views

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/rank_primary_views.py"
      - "scripts/apply_storefront_enhancements.py"
      - "image-zoom.js"
      - ".github/workflows/normalize-primary-views.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: normalize-primary-views-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: open-clip-vit-b-32-openai-v1

      - name: Install image classifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install pillow open_clip_torch

      - name: Add click-to-zoom module
        run: python scripts/apply_storefront_enhancements.py

      - name: Rank all local product photos
        run: |
          python scripts/rank_primary_views.py \
            --index catalog-source.html \
            --report data/primary-view-report.json \
            --model ViT-B-32 \
            --pretrained openai \
            --batch-size 48 \
            --device cpu

      - name: Validate first images and directImage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source=Path('catalog-source.html').read_text(encoding='utf-8')
          marker='const PRODUCTS ='
          start=source.index(marker)+len(marker)
          while source[start].isspace(): start+=1
          products,_=json.JSONDecoder().raw_decode(source[start:])
          errors=[]
          for product in products:
              images=[value for value in product.get('images',[]) if isinstance(value,str) and value]
              if not images:
                  errors.append(f"{product.get('id')}: пустая галерея")
                  continue
              first=images[0].split('?',1)[0]
              if not first.startswith('assets/interiors/') and not Path(first).is_file():
                  errors.append(f"{product.get('id')}: отсутствует {first}")
              direct=str(product.get('directImage') or '').split('?',1)[0]
              if direct != first:
                  errors.append(f"{product.get('id')}: directImage={direct}, first={first}")
          if errors:
              raise SystemExit('Проверка не пройдена:\n'+'\n'.join(errors[:100]))
          print(f'Проверены первые изображения: {len(products)} карточек')
          PY

      - name: Build visual review sheets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          report=json.loads(Path('data/primary-view-report.json').read_text(encoding='utf-8'))
          records=report['records']
          priority=[493,896,189,136,70,1477,33,656,843,1182,298,894,899,908,893,863,855,307]
          by_id={int(row['id']):row for row in records}
          chosen=[]
          for product_id in priority:
              row=by_id.get(product_id)
              if row and row not in chosen: chosen.append(row)
          for row in records:
              if row.get('low_confidence') and row not in chosen:
                  chosen.append(row)
              if len(chosen)>=42: break
          for row in records:
              if row.get('changed') and row not in chosen:
                  chosen.append(row)
              if len(chosen)>=72: break

          out=Path('primary-view-review'); out.mkdir(exist_ok=True)
          font=ImageFont.load_default()
          per_sheet=18
          cell_w,cell_h=430,390
          for sheet_index in range((len(chosen)+per_sheet-1)//per_sheet):
              chunk=chosen[sheet_index*per_sheet:(sheet_index+1)*per_sheet]
              sheet=Image.new('RGB',(cell_w*3,cell_h*6),'white')
              draw=ImageDraw.Draw(sheet)
              for index,row in enumerate(chunk):
                  rr,cc=divmod(index,3); x0=cc*cell_w; y0=rr*cell_h
                  draw.rectangle((x0,y0,x0+cell_w-1,y0+cell_h-1),outline='black',width=2)
                  title=f"ID {row['id']} {row.get('name','')}"[:62]
                  metrics=f"3/4 {row.get('front_three_quarter_probability',0):.2f} front {row.get('front_probability',0):.2f} low={row.get('low_confidence')}"
                  draw.text((x0+8,y0+7),title,fill='black',font=font)
                  draw.text((x0+8,y0+25),metrics,fill='black',font=font)
                  path=Path(str(row['after_first']).split('?',1)[0])
                  with Image.open(path) as image:
                      image=image.convert('RGB')
                      image.thumbnail((cell_w-24,cell_h-72),Image.Resampling.LANCZOS)
                      x=x0+(cell_w-image.width)//2
                      y=y0+54+(cell_h-62-image.height)//2
                      sheet.paste(image,(x,y))
              sheet.save(out/f'primary-view-sheet-{sheet_index+1}.jpg',quality=93)
          Path(out/'summary.json').write_text(json.dumps({
              'total_products':report['total_products'],
              'classified_products':report['classified_products'],
              'classified_images':report['classified_images'],
              'changed_galleries':report['changed_galleries'],
              'low_confidence_products':report['low_confidence_products'],
              'reviewed_records':len(chosen),
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: primary-view-review
          path: primary-view-review

      - name: Commit normalized catalog
        shell: bash
        run: |
          set -euo pipefail
          git add catalog-source.html data/primary-view-report.json
          if git diff --cached --quiet; then
            echo "Catalog primary views are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize primary product views to front three-quarter"
          git push origin "HEAD:${TARGET_BRANCH}"
