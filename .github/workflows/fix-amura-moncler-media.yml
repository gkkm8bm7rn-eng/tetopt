name: Fix Amura and Moncler media
on:
  issues:
    types: [opened, reopened]
  push:
    paths:
      - 'data/amura-moncler-fix-request.txt'
permissions:
  contents: write
jobs:
  fix:
    if: github.event_name == 'push' || github.event.issue.title == '[media-fix] Amura Moncler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests Pillow
      - name: Apply targeted fixes
        run: python scripts/fix-amura-moncler-media.py
      - name: Commit verified media repair
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products/495 data/details/001.json data/catalog-index.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix Amura and Moncler product media'
          git pull --rebase origin main
          git push origin HEAD:main
