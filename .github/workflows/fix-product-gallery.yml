name: Fix product gallery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-product-gallery.yml"

permissions:
  contents: write

jobs:
  fix:
    name: Show local photos in product gallery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch gallery logic
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="      if(LOCAL_IMAGES_ONLY)return photos;"; new="      if(local.length || LOCAL_IMAGES_ONLY)return photos;"; assert old in s or new in s, "Gallery fragment not found"; p.write_text(s.replace(old,new,1), encoding="utf-8") if old in s else print("Gallery already fixed")'

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No repository changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix local product gallery loading"
          git push origin "HEAD:main"
