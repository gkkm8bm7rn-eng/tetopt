name: Verify live assets on both sites

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-live-assets-verification.trigger

permissions:
  contents: write

concurrency:
  group: verify-live-assets
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Verify GitHub Pages and Cloudflare
        continue-on-error: true
        run: |
          python scripts/verify_live_assets.py \
            --out data/live-assets-verification-batch-01.json \
            https://gkkm8bm7rn-eng.github.io/tetopt/ \
            https://tetopt.m78m6cfc2v.workers.dev/

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-assets-verification-batch-01.json
          if git diff --cached --quiet; then
            echo "No verification report changes"
          else
            git commit -m "Verify live assets for batch 1"
            git push
          fi
