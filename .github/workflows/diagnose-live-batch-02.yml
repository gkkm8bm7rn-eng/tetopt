name: Diagnose live batch 02

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-diagnose-live-batch-02.trigger

permissions:
  contents: write

concurrency:
  group: diagnose-live-batch-02
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run definitive verification for all 20 products
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/final_verify_batch_02_stdlib.py 2>&1 | tee data/batch-02-final-verification-stdlib.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit definitive verification evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/batch-02-final-verification.json data/batch-02-final-verification-error.json data/batch-02-final-verification-stdlib.log photo-processing-progress.json data/batch-02-exact-apply-report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            if [ "${{ steps.verify.outputs.exit_code }}" = "0" ]; then
              git commit -m "Завершить окончательную проверку второй партии"
            else
              git commit -m "Зафиксировать ошибку окончательной проверки второй партии"
            fi
            git pull --rebase origin main
            git push
          fi

      - name: Fail when verification failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
