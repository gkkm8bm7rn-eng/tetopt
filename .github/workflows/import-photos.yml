name: Curate and import product photos

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Сколько отсутствующих товаров обработать за запуск"
        required: true
        default: "100"
        type: string
      max_photos:
        description: "Максимум товарных фото до интерьерной визуализации"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4"]
      retry_failed:
        description: "Повторить товары после предыдущих неудачных попыток"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/curate_existing_photos.py"
      - "scripts/curated_photo_import.py"
      - ".github/workflows/import-photos.yml"

permissions:
  contents: write

concurrency:
  group: forma-home-photo-import
  cancel-in-progress: false

jobs:
  curate:
    name: Check full views and image quality
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow

      - name: Reorder and reduce existing galleries
        run: |
          python scripts/curate_existing_photos.py \
            --index catalog-source.html \
            --max-product-photos 3 \
            --minimum-primary-score 10

      - name: Import missing product photos
        shell: bash
        env:
          BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '50' }}
          MAX_PHOTOS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_photos || '3' }}
          RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_failed || false }}
        run: |
          set -euo pipefail
          args=(
            --index catalog-source.html
            --batch-size "$BATCH_SIZE"
            --max-photos "$MAX_PHOTOS"
            --workers 4
            --max-side 1800
            --max-kb 520
          )
          if [[ "$RETRY_FAILED" == "true" ]]; then
            args+=(--retry-failed)
          fi
          python scripts/curated_photo_import.py "${args[@]}"

      - name: Validate referenced files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          html=Path('catalog-source.html').read_text(encoding='utf-8')
          marker='const PRODUCTS ='
          start=html.index(marker)+len(marker)
          while html[start].isspace(): start+=1
          products,_=json.JSONDecoder().raw_decode(html[start:])
          errors=[]
          for product in products:
              for relative in product.get('images') or []:
                  if not isinstance(relative,str) or relative.startswith(('http://','https://')):
                      continue
                  path=Path(relative)
                  if not path.is_file():
                      errors.append(f"Товар {product.get('id')}: нет файла {relative}")
                      continue
                  try:
                      with Image.open(path) as image:
                          image.verify()
                  except Exception as exc:
                      errors.append(f"Товар {product.get('id')}: {relative}: {exc}")
          if errors:
              raise SystemExit('Проверка ссылок не пройдена:\n'+'\n'.join(errors[:80]))
          print('Все опубликованные локальные изображения существуют и читаются.')
          PY

      - name: Commit curated photos and report
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No repository changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Curate product galleries (run $GITHUB_RUN_NUMBER)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
