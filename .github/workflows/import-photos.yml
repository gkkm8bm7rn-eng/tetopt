name: Import product photos

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Сколько товаров обработать за этот запуск"
        required: true
        default: "100"
        type: string
      max_photos:
        description: "Максимум фотографий на один товар (рекомендуется 3)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      retry_failed:
        description: "Повторить товары, которые уже исчерпали попытки"
        required: false
        default: false
        type: boolean
      finalize_local_only:
        description: "Отключить поставщика и прокси после завершения всего импорта"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: forma-home-photo-import
  cancel-in-progress: false

jobs:
  import:
    name: Download, optimize and commit photos
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow

      - name: Import next product batch
        shell: bash
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_PHOTOS: ${{ inputs.max_photos }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          FINALIZE_LOCAL_ONLY: ${{ inputs.finalize_local_only }}
        run: |
          set -euo pipefail
          args=(
            --index index.html
            --batch-size "$BATCH_SIZE"
            --max-photos "$MAX_PHOTOS"
            --workers 4
            --max-side 1200
            --max-kb 180
          )

          if [[ "$RETRY_FAILED" == "true" ]]; then
            args+=(--retry-failed)
          fi

          if [[ "$FINALIZE_LOCAL_ONLY" == "true" ]]; then
            args+=(--finalize-local-only)
          fi

          python scripts/import_photos.py "${args[@]}"

      - name: Commit imported photos
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No repository changes were produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import product photos (run $GITHUB_RUN_NUMBER)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
