name: Build angle review

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-angle-review.yml"

permissions:
  contents: read

concurrency:
  group: angle-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: agent/front-three-quarter-and-image-zoom

      - name: Install free image tool
        run: python -m pip install --quiet pillow

      - name: Build full-gallery contact sheets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          ids=[493,497,136,1182,298,301,577,952,1075,164,1014,720]
          source=Path('catalog-source.html').read_text(encoding='utf-8')
          marker='const PRODUCTS ='
          start=source.index(marker)+len(marker)
          while source[start].isspace(): start+=1
          products,_=json.JSONDecoder().raw_decode(source[start:])
          by_id={int(p['id']):p for p in products}

          out=Path('angle-review'); out.mkdir(exist_ok=True)
          font=ImageFont.load_default()
          cell_w,cell_h=300,330
          cols=5
          rows_per_sheet=4
          for sheet_index in range((len(ids)+rows_per_sheet-1)//rows_per_sheet):
              chunk=ids[sheet_index*rows_per_sheet:(sheet_index+1)*rows_per_sheet]
              sheet=Image.new('RGB',(cell_w*cols,cell_h*rows_per_sheet),'white')
              draw=ImageDraw.Draw(sheet)
              for row_index,product_id in enumerate(chunk):
                  product=by_id[product_id]
                  images=[]
                  for value in product.get('images',[]):
                      if not isinstance(value,str) or not value: continue
                      clean=value.split('?',1)[0]
                      if clean.startswith('assets/interiors/'): continue
                      if Path(clean).is_file() and clean not in images: images.append(clean)
                  folder=Path('assets/products')/str(product_id)
                  if folder.is_dir():
                      for path in sorted(folder.glob('*')):
                          if path.suffix.lower() in {'.webp','.jpg','.jpeg','.png'}:
                              value=path.as_posix()
                              if value not in images: images.append(value)
                  images=images[:cols]
                  for col_index in range(cols):
                      x0,y0=col_index*cell_w,row_index*cell_h
                      draw.rectangle((x0,y0,x0+cell_w-1,y0+cell_h-1),outline='black',width=2)
                      if col_index==0:
                          draw.text((x0+6,y0+6),f"ID {product_id} {product.get('name','')}"[:52],fill='black',font=font)
                      if col_index>=len(images):
                          draw.text((x0+8,y0+35),'no image',fill='black',font=font)
                          continue
                      path=Path(images[col_index])
                      draw.text((x0+6,y0+24),path.name,fill='black',font=font)
                      with Image.open(path) as image:
                          image=image.convert('RGB')
                          image.thumbnail((cell_w-20,cell_h-58),Image.Resampling.LANCZOS)
                          sheet.paste(image,(x0+(cell_w-image.width)//2,y0+48+(cell_h-52-image.height)//2))
              sheet.save(out/f'angle-review-{sheet_index+1}.jpg',quality=90,optimize=True)
          Path(out/'ids.json').write_text(json.dumps(ids)+'\n',encoding='utf-8')
          PY

      - name: Upload short-lived review
        uses: actions/upload-artifact@v4
        with:
          name: angle-review
          path: angle-review
          retention-days: 1
