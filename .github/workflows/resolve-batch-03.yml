name: Resolve batch 03

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data/run-batch-03-resolution.trigger

permissions:
  contents: write

concurrency:
  group: resolve-batch-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve four cards conservatively
        run: python scripts/resolve_batch_03_unresolved.py

      - name: Validate loader syntax
        run: node --check catalog-loader.js

      - name: Commit resolved galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog-source.html catalog-loader.js index.html photo-processing-progress.json data/batch-03-resolution-report.json
          git commit -m "Исправить четыре спорные карточки третьей партии"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
