name: Connect checkout form

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-all-product-photos.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inject checkout script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = '<script src="checkout.js?v=1"></script>'

          if marker in text:
              print("Checkout script is already connected.")
          else:
              anchor = "      document.open();"
              if anchor not in text:
                  raise SystemExit("Index injection anchor not found")
              injection = "      html=html.replace('</body>', '" + marker + "</body>');\n\n"
              text = text.replace(anchor, injection + anchor, 1)
              path.write_text(text, encoding="utf-8")
              print("Checkout script connected.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable customer checkout form"
          git push origin "HEAD:main"
