name: Connect store contacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-all-product-photos.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Connect contact configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<script src="checkout.js?v=1"></script>'
          new = '<script src="checkout.js?v=1"></script><script src="checkout-contacts.js?v=1"></script>'

          if new in text:
              print("Store contacts are already connected.")
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("Store contacts connected.")
          else:
              raise SystemExit("Checkout script marker not found")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect checkout to store contacts"
          git push origin "HEAD:main"
