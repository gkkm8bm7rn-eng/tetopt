name: Publish confirmed product photos

on:
  pull_request:
    branches: [main]
    paths:
      - "image-zoom.js"
      - "scripts/build_confident_release.py"
      - ".github/workflows/publish-confident-photos.yml"

permissions:
  contents: write

concurrency:
  group: publish-confident-product-photos
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/publish-confident-photos-swipe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: agent/publish-confident-photos-swipe
          fetch-depth: 0

      - name: Check whether release is already built
        id: gate
        shell: bash
        run: |
          if test -f data/confident-photo-release.json; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Selective release already generated."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch verified photo source
        if: steps.gate.outputs.run == 'true'
        run: git fetch origin agent/front-three-quarter-and-image-zoom

      - name: Build confirmed-photo release
        if: steps.gate.outputs.run == 'true'
        run: python scripts/build_confident_release.py

      - name: Validate selective changes and swipe gallery
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node --check image-zoom.js
          grep -q 'image-zoom.js?v=3' catalog-source.html
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          report=json.loads(Path('data/confident-photo-release.json').read_text(encoding='utf-8'))
          allowed=set(report['published_ids'])
          if report['published_products']!=28 or len(allowed)!=28:
              raise SystemExit(f"Ожидалось 28 подтверждённых товаров, получено {report['published_products']} / {len(allowed)}")
          if report['archived_products']!=361 or report['archived_products_changed']!=0:
              raise SystemExit('Нарушена изоляция архивных товаров')
          if not all(report['zoom_gallery'].values()):
              raise SystemExit('Не все функции увеличенной галереи включены')

          changed=subprocess.run(
              ['git','status','--porcelain','--untracked-files=all'],
              check=True,capture_output=True,text=True,encoding='utf-8'
          ).stdout.splitlines()
          bad_assets=[]
          for row in changed:
              path=row[3:] if len(row)>=4 else row
              match=re.match(r'assets/products/(\d+)/',path)
              if match and int(match.group(1)) not in allowed:
                  bad_assets.append(path)
          if bad_assets:
              raise SystemExit('Изменены фотографии вне подтверждённого списка:\n'+'\n'.join(bad_assets[:30]))

          source=Path('catalog-source.html').read_text(encoding='utf-8')
          marker='const PRODUCTS ='
          start=source.index(marker)+len(marker)
          while source[start].isspace(): start+=1
          products,_=json.JSONDecoder().raw_decode(source[start:])
          by_id={int(product['id']):product for product in products}
          for row in report['products']:
              product=by_id[row['product_id']]
              first=str(product['images'][0]).split('?',1)[0]
              direct=str(product.get('directImage') or '').split('?',1)[0]
              expected=str(row['cover']).split('?',1)[0]
              if first!=expected or direct!=expected:
                  raise SystemExit(f"ID {row['product_id']}: first={first}, direct={direct}, expected={expected}")
              if not Path(first).is_file():
                  raise SystemExit(f"ID {row['product_id']}: отсутствует {first}")
          print('Проверены 28 подтверждённых товаров, свайп и изоляция архива')
          PY

      - name: Commit confirmed release
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add assets/products catalog-source.html catalog-loader.js image-zoom.js data/confident-photo-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish 28 confirmed cover photos with swipe gallery"
          git push origin HEAD:agent/publish-confident-photos-swipe
