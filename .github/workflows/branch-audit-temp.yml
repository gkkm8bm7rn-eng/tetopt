name: Temporary branch audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-audit-temp.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Build branch audit
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, json
          def out(*args):
              return subprocess.check_output(args, text=True).strip()
          refs = out('git','for-each-ref','--format=%(refname:short)','refs/remotes/origin').splitlines()
          rows=[]
          for ref in refs:
              if ref in ('origin/HEAD','origin/main'):
                  continue
              name=ref.removeprefix('origin/')
              unique=int(out('git','rev-list','--count',f'origin/main..{ref}') or '0')
              behind=int(out('git','rev-list','--count',f'{ref}..origin/main') or '0')
              merged = subprocess.call(['git','merge-base','--is-ancestor',ref,'origin/main'])==0
              sha=out('git','rev-parse',ref)
              date=out('git','show','-s','--format=%cI',ref)
              subject=out('git','show','-s','--format=%s',ref)
              rows.append({'branch':name,'sha':sha,'merged_into_main':merged,'unique_commits_vs_main':unique,'main_commits_ahead':behind,'last_commit_date':date,'last_commit_subject':subject})
          rows.sort(key=lambda r:r['branch'].casefold())
          with open('data/branch-audit.json','w',encoding='utf-8') as f:
              json.dump({'count':len(rows),'branches':rows},f,ensure_ascii=False,indent=2);f.write('\n')
          PY
      - name: Save audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/branch-audit.json
          git commit -m 'Record temporary branch audit' || exit 0
          git push origin HEAD:main
