name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete all branches except main and backup
        shell: bash
        run: |
          set -euo pipefail
          keep_main='main'
          keep_backup='backup-main-before-atelier-2026-08-16'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = 'HEAD' ] && continue
            if [ "$branch" = "$keep_main" ] || [ "$branch" = "$keep_backup" ]; then
              echo "KEEP $branch"
            else
              echo "DELETE $branch"
              git push origin --delete "$branch" || true
            fi
          done
