name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete all branches except main and backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v '^HEAD$' | grep -v '^main$' | grep -v '^backup-main-before-atelier-2026-08-16$' || true)
          printf 'Deleting %s branches\n' "${#branches[@]}"
          if [ "${#branches[@]}" -gt 0 ]; then
            printf '%s\0' "${branches[@]}" | xargs -0 -r -n 20 git push origin --delete
          fi
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/
