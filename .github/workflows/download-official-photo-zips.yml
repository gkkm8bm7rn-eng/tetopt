name: Download official product photo archives

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/visually-fix-primary-photos

      - name: Install tools
        run: python -m pip install --quiet pillow requests

      - name: Download archives and build sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import hashlib, io, json, requests, zipfile

          ITEMS = [
            (298,25405,'Луц — серый'),(894,25433,'Осло — серый'),
            (899,25506,'Рефлекс — светло-серый'),(908,25118,'Пуф Чарли — серый'),
            (893,25718,'Агнет — светло-бежевый'),(863,25122,'Банкетка Чарли — какао'),
            (855,25273,'Космо — бежевый'),(307,25707,'Монклер — бежевый'),
            (33,19252,'Гленд — черный'),(656,20437,'Чавари — золотой'),
            (843,25842,'Диван Чарли — бежевый'),(1182,25661,'Нордик — черный'),
            (493,26023,'Амура — бежевый'),(896,25435,'Осло — горчичный'),
            (189,24554,'Синди Софт — бежевый'),(136,24914,'Бари полубарный — бежевый'),
          ]
          root=Path('official-zip-photo-review'); root.mkdir(exist_ok=True)
          session=requests.Session(); session.headers['User-Agent']='Mozilla/5.0'
          font=ImageFont.load_default(); manifest=[]

          for product_id,code,title in ITEMS:
            url=f'https://price.tetchair.ru/download_photo/?id={code}'
            row={'id':product_id,'code':code,'title':title,'url':url,'status':None,'contentType':None,'images':[],'error':None}
            try:
              r=session.get(url,timeout=90,allow_redirects=True)
              row['status']=r.status_code; row['contentType']=r.headers.get('content-type')
              r.raise_for_status()
              data=r.content
              images=[]
              if zipfile.is_zipfile(io.BytesIO(data)):
                with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for name in z.namelist():
                    if name.lower().endswith(('.jpg','.jpeg','.png','.webp')):
                      images.append((name,z.read(name)))
              else:
                images.append(('downloaded-image',data))

              dedup={}
              for name,content in images:
                digest=hashlib.sha256(content).hexdigest()
                try:
                  with Image.open(io.BytesIO(content)) as im:
                    w,h=im.size
                    if w<300 or h<300: continue
                  dedup[digest]=(name,content,w,h)
                except Exception:
                  continue
              ordered=sorted(dedup.values(),key=lambda x:x[2]*x[3],reverse=True)
              cols=4; cell=300; label_h=48; rows=max(1,(len(ordered)+cols-1)//cols)
              sheet=Image.new('RGB',(cols*cell,40+rows*(cell+label_h)),'white')
              draw=ImageDraw.Draw(sheet); draw.text((10,10),f'ID {product_id} / code {code} — {title} — {len(ordered)} images',fill='black',font=font)
              for idx,(name,content,w,h) in enumerate(ordered):
                rr,cc=divmod(idx,cols); x0=cc*cell; y0=40+rr*(cell+label_h)
                with Image.open(io.BytesIO(content)) as im:
                  im=im.convert('RGB'); im.thumbnail((cell-18,cell-18),Image.Resampling.LANCZOS)
                  sheet.paste(im,(x0+(cell-im.width)//2,y0+(cell-im.height)//2))
                draw.rectangle((x0,y0,x0+cell-1,y0+cell+label_h-1),outline='black',width=1)
                draw.text((x0+5,y0+cell+4),f'{idx+1:02d} {w}x{h} {Path(name).name[:24]}',fill='black',font=font)
                ext=Path(name).suffix.lower()
                if ext not in ['.jpg','.jpeg','.png','.webp']: ext='.jpg'
                out_name=f'{product_id}-{idx+1:02d}{ext}'
                (root/out_name).write_bytes(content)
                row['images'].append({'index':idx+1,'file':out_name,'archiveName':name,'width':w,'height':h})
              sheet.save(root/f'{product_id}-contact-sheet.jpg',quality=92)
            except Exception as exc:
              row['error']=f'{type(exc).__name__}: {exc}'
            manifest.append(row)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Keep only lightweight review files
        shell: bash
        run: |
          find official-zip-photo-review -type f \
            ! -name '*-contact-sheet.jpg' \
            ! -name 'manifest.json' -delete

      - name: Upload official photo contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: official-product-photo-contact-sheets
          path: official-zip-photo-review
