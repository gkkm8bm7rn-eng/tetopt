name: One-time Kemchand supplier photo import
on:
  push:
    branches:
      - catalog/kemchand-2026-10-17
    paths:
      - .github/workflows/kemchand-photos.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Download exact supplier product photographs and convert to local webp
        shell: bash
        run: |
          python - <<'PY'
          import io, json, hashlib, pathlib, time, urllib.request
          from PIL import Image, ImageOps
          detail_path=pathlib.Path("data/details/015.json")
          index_path=pathlib.Path("data/catalog-index.json")
          details=json.loads(detail_path.read_text(encoding="utf-8"))
          index=json.loads(index_path.read_text(encoding="utf-8"))
          records=[]
          for number in range(596,604):
              model=f"model-{number}"
              d=details["products"][model]
              v=d["variants"][0]
              sid=v["sourceId"]
              original_urls=list(v["images"])
              if not (2 <= len(original_urls) <= 3): raise ValueError(f"Invalid gallery {sid}")
              local=[]
              for i,url in enumerate(original_urls):
                  if not url.startswith("https://secretdemaison.ru/netcat_files/"): raise ValueError(url)
                  output=pathlib.Path(f"assets/products/{sid}/{'00-main' if i==0 else f'{i:02d}'}.webp")
                  output.parent.mkdir(parents=True,exist_ok=True)
                  error=None
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; TETOpt-Catalog-QA/1.0)","Referer":v["photoBankSource"],"Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8"})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              data=response.read(15_000_000)
                          with Image.open(io.BytesIO(data)) as image:
                              image=ImageOps.exif_transpose(image)
                              if image.width<300 or image.height<300:raise ValueError(f"Low resolution {sid}/{i}: {image.size}")
                              image.convert("RGB").save(output,format="WEBP",quality=88,method=5)
                              width,height=image.size
                          if output.stat().st_size<5_000:raise ValueError(f"Bad image {output}")
                          error=None
                          break
                      except Exception as exc:
                          error=exc
                          time.sleep(2+attempt*2)
                  if error:raise RuntimeError(f"Could not import {sid}/{i}: {error}")
                  local.append(str(output))
                  records.append({"sourceId":sid,"originalUrl":url,"localPath":str(output),"width":width,"height":height,"sha256":hashlib.sha256(output.read_bytes()).hexdigest()})
              v["images"]=local
              v["primaryImage"]=local[0]
              v["localImageCount"]=len(local)
              v["primaryImageVerified"]=False
              v["primaryImageStatus"]="supplier-gallery-local-pending-visual-qa"
              v["primaryImageManifest"]="data/kemchand-photo-import-2026-10-19.json"
              idx=next(p for p in index["products"] if p["id"]==model)
              idx["variants"][0]["primaryImage"]=local[0]
              if idx["variants"][0]["sourceId"]!=sid:raise ValueError(f"Index mismatch {sid}")
          detail_path.write_text(json.dumps(details,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          index_path.write_text(json.dumps(index,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          pathlib.Path("data/kemchand-photo-import-2026-10-19.json").write_text(json.dumps({"source":"Secret de Maison official product galleries","sourceDate":"2026-10-19","count":len(records),"files":records},ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Saved {len(records)} images for 8 products")
          PY
      - name: Commit verified-source assets to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/ data/details/015.json data/catalog-index.json data/kemchand-photo-import-2026-10-19.json
          git diff --cached --quiet && exit 1
          git commit -m "Import Kemchand product gallery images locally"
          git push origin HEAD:catalog/kemchand-2026-10-17
