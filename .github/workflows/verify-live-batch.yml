name: Verify live curated batch

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-live-verification.trigger

permissions:
  contents: write

concurrency:
  group: verify-live-curated-batch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify both published sites
        continue-on-error: true
        run: |
          python scripts/verify_live_batch.py \
            --out data/live-verification-batch-01.json \
            https://gkkm8bm7rn-eng.github.io/tetopt/ \
            https://tetopt.m78m6cfc2v.workers.dev/

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-verification-batch-01.json
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            git commit -m "Verify live photo batch 1"
            git push
          fi
