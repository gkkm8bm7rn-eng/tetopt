name: Temporary Atelier price smoke
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths: ['.github/workflows/temp-atelier-price-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
      - name: Validate JavaScript and catalog JSON
        run: |
          node --check app.js
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          index=json.loads(Path('data/catalog-index.json').read_text(encoding='utf-8'))
          assert index['stats']['variants']==1181
          shards=sorted(Path('data/details').glob('*.json'))
          assert len(shards)==14
          detail_variants=0
          for p in shards:
              d=json.loads(p.read_text(encoding='utf-8'))
              for model in d['products'].values(): detail_variants+=len(model['variants'])
          assert detail_variants==1181, detail_variants
          text=urllib.request.urlopen('https://raw.githubusercontent.com/gkkm8bm7rn-eng/tetopt/main/catalog-source.html',timeout=30).read().decode('utf-8')
          token='const PRODUCTS = '; start=text.index(token)+len(token)
          main,_=json.JSONDecoder().raw_decode(text[start:])
          prices={int(p['id']):int(p.get('wholesalePrice') or 0) for p in main}
          mism=[]
          for model in index['products']:
              for v in model['variants']:
                  sid=int(v['sourceId'])
                  if sid in prices and int(v['wholesalePrice'] or 0)!=prices[sid]: mism.append((sid,v['wholesalePrice'],prices[sid]))
          assert not mism, mism[:20]
          print('OK: app.js syntax; 532 models; 1181 variants; 14 detail shards; wholesale prices synchronized with corrected main')
          PY
      - name: Serve and request critical files
        run: |
          python -m http.server 8765 >/tmp/atelier-http.log 2>&1 &
          pid=$!
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8765/app.js >/dev/null
          curl --fail --silent http://127.0.0.1:8765/data/catalog-index.json >/dev/null
          curl --fail --silent http://127.0.0.1:8765/data/details/001.json >/dev/null
          kill $pid
          echo 'OK: static site critical files served successfully'
