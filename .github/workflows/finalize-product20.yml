name: Finalize product 20 and close batch 1

on:
  workflow_dispatch:
  push:
    paths:
      - data/run-finalize-product20.trigger

permissions:
  contents: write

concurrency:
  group: finalize-product20
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize exact product photos
        run: python scripts/finalize_product20.py

      - name: Commit product and completed batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/20 catalog-source.html photo-processing-progress.json index.html data/curation-batch-01.json data/curation-batch-01-final.json
          if git diff --cached --quiet; then
            echo "No product changes"
          else
            git commit -m "Finalize verified product 20 and batch 1"
            git push
          fi
