name: Final verify batch 03

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data/run-final-verify-batch-03.trigger

permissions:
  contents: write

concurrency:
  group: final-verify-batch-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for both publications
        run: sleep 45

      - name: Verify all 20 cards on GitHub Pages and Cloudflare
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/final_verify_batch_03_stdlib.py 2>&1 | tee data/batch-03-final-verification.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verification evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data photo-processing-progress.json
          if git diff --cached --quiet; then
            echo "No verification changes"
          else
            if [ "${{ steps.verify.outputs.exit_code }}" = "0" ]; then
              git commit -m "Завершить окончательную проверку третьей партии"
            else
              git commit -m "Зафиксировать ошибку финальной проверки третьей партии"
            fi
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Fail when verification failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
