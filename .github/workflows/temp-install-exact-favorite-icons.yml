name: Temporary install exact Atelier favorite icons

on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-favorite-icons/**'
      - '.github/workflows/temp-install-exact-favorite-icons.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0

      - name: Decode exact reference assets
        run: |
          mkdir -p assets/ui
          cat .tmp-favorite-icons/inactive-*.b64 | tr -d '\n\r ' | base64 -d > assets/ui/favorite-inactive.png
          cat .tmp-favorite-icons/active-*.b64 | tr -d '\n\r ' | base64 -d > assets/ui/favorite-active.png

      - name: Integrate icons into existing favorite controls
        run: python .tmp-favorite-icons/install.py

      - name: Validate exact assets and site
        run: |
          node --check app.js
          python - <<'PY'
          import struct
          from pathlib import Path
          expected={'favorite-inactive.png':(233,204),'favorite-active.png':(339,385)}
          for name,size in expected.items():
              p=Path('assets/ui')/name
              b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',b[16:24])==size
          css=Path('card-polish.css').read_text(encoding='utf-8')
          enh=Path('enhancements.css').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          assert 'assets/ui/favorite-inactive.png' in css
          assert 'assets/ui/favorite-active.png' in css
          assert '--fav-outline' not in enh and '--fav-active' not in enh
          assert "${favorite?'♥':'♡'}" not in app
          print('OK: exact two-state favorite assets installed; legacy drawn icon layer removed')
          PY
          python -m http.server 8765 >/tmp/http.log 2>&1 &
          pid=$!; sleep 1
          curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8765/assets/ui/favorite-inactive.png >/dev/null
          curl --fail --silent http://127.0.0.1:8765/assets/ui/favorite-active.png >/dev/null
          curl --fail --silent http://127.0.0.1:8765/data/catalog-index.json >/dev/null
          kill $pid

      - name: Commit final icon integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/favorite-inactive.png assets/ui/favorite-active.png enhancements.css card-polish.css index.html app.js
          git commit -m "Replace Atelier favorites with exact reference icons"
          git push origin HEAD:forma-atelier-zero-2026
