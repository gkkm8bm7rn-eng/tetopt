name: Variant local render core
on:
  push:
    branches: [variant-local-render-core]
    paths: ['.github/workflows/variant-local-render-core.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: variant-local-render-core
          fetch-depth: 0
      - name: Patch variant rendering in core handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()
          old = "if(b.dataset.cardVariant){e.stopPropagation();const p=state.products.find(x=>x.id===b.dataset.product);if(p){p._selected=b.dataset.cardVariant;renderCatalog()}}"
          new = "if(b.dataset.cardVariant){e.stopPropagation();const p=state.products.find(x=>x.id===b.dataset.product),next=String(b.dataset.cardVariant),card=b.closest('.product-card');if(p&&card&&String(p._selected)!==next){p._selected=next;card.outerHTML=cardTemplate(p)}}"
          assert text.count(old) == 1, f'app.js target count: {text.count(old)}'
          app.write_text(text.replace(old, new))

          variants = Path('variants.js')
          text = variants.read_text()
          old = """document.addEventListener('click',async event=>{
            const button=event.target.closest('[data-axis]');
            if(!button)return;
            event.stopPropagation();
            const product=state.products.find(item=>item.id===button.dataset.product),match=product&&selectAxis(product,button.dataset.axis,button.dataset.axisValue);
            if(!match)return;
            if(button.closest('[data-detail-id]')){
              const full=await getFullProduct(product);
              full._selected=match.sourceId;
              els.detail.innerHTML=detailTemplate(full,currentVariant(full,match.sourceId));
            }else renderCatalog();
          },true);"""
          new = """document.addEventListener('click',async event=>{
            const button=event.target.closest('[data-axis]');
            if(!button)return;
            event.stopPropagation();
            const product=state.products.find(item=>item.id===button.dataset.product),previous=product?String(product._selected):'',match=product&&selectAxis(product,button.dataset.axis,button.dataset.axisValue);
            if(!match)return;
            if(button.closest('[data-detail-id]')){
              const full=await getFullProduct(product);
              full._selected=match.sourceId;
              els.detail.innerHTML=detailTemplate(full,currentVariant(full,match.sourceId));
            }else if(String(match.sourceId)!==previous){
              const card=button.closest('.product-card');
              if(card)card.outerHTML=cardTemplate(product);
            }
          },true);"""
          assert text.count(old) == 1, f'variants.js target count: {text.count(old)}'
          variants.write_text(text.replace(old, new))
          PY
      - name: Verify JavaScript and diff
        run: |
          node --check app.js
          node --check variants.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text()
          variants=Path('variants.js').read_text()
          assert "p._selected=b.dataset.cardVariant;renderCatalog()" not in app
          assert "}else renderCatalog();\n},true);" not in variants
          assert "card.outerHTML=cardTemplate(p)" in app
          assert "card.outerHTML=cardTemplate(product)" in variants
          PY
      - name: Commit core fix and remove one-shot workflow
        run: |
          git config user.name 'FORMA HOME maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js variants.js
          git rm .github/workflows/variant-local-render-core.yml
          git commit -m 'Render product variant changes per card'
          git push origin HEAD:variant-local-render-core
