name: Publish confirmed remaining covers batch 11

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-remaining-batch-11.yml"

permissions:
  contents: write

concurrency:
  group: publish-confirmed-remaining-batch-11
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/publish-remaining-batch-11'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: agent/publish-remaining-batch-11
          fetch-depth: 0

      - name: Check whether release is already built
        id: gate
        shell: bash
        run: |
          if test -f data/confirmed-photo-release-batch-11.json; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch verified photo source
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin agent/front-three-quarter-and-image-zoom
          git worktree add /tmp/source origin/agent/front-three-quarter-and-image-zoom

      - name: Build and validate selective release
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import copy, json, re, shutil, subprocess
          from pathlib import Path

          ROOT=Path('.')
          SOURCE=Path('/tmp/source')
          APPROVED=[892,895,897,898,901,902,903,904,905,906,909,912,913,915,917,918,919,920,928,930,932,934,935,938,939,955,957,961,965,967,971,974,977,978,979,980,981]
          SKIPPED=[921,922,923,926,927,929,936,941,943,947,948,950,951,952,953,958,960,963,964,966,968,969,970]

          def read_products(path):
              text=path.read_text(encoding='utf-8')
              marker='const PRODUCTS ='
              start=text.index(marker)+len(marker)
              while text[start].isspace(): start+=1
              products,consumed=json.JSONDecoder().raw_decode(text[start:])
              return text,products,start,start+consumed

          main_text,products,start,end=read_products(ROOT/'catalog-source.html')
          _,source_products,_,_=read_products(SOURCE/'catalog-source.html')
          baseline=copy.deepcopy(products)
          by_id={int(p['id']):p for p in products}
          source_by_id={int(p['id']):p for p in source_products}
          baseline_by_id={int(p['id']):p for p in baseline}
          hidden={int(v) for v in json.loads((ROOT/'hidden-products.json').read_text(encoding='utf-8')).get('ids',[])}

          published=set()
          for path in [ROOT/'data/confident-photo-release.json']+sorted(ROOT.glob('data/confirmed-photo-release-batch-*.json')):
              report=json.loads(path.read_text(encoding='utf-8'))
              published.update(int(v) for v in report.get('published_ids',[]))

          approved=set(APPROVED)
          if len(APPROVED)!=37 or len(approved)!=37: raise SystemExit('Ожидалось 37 уникальных подтверждённых ID')
          if len(published)!=527: raise SystemExit(f'До партии ожидалось 527 подтверждённых товаров, получено {len(published)}')
          if approved & hidden: raise SystemExit(f'В партию попал архив: {sorted(approved & hidden)}')
          if approved & published: raise SystemExit(f'Повторно включены ID: {sorted(approved & published)}')
          if approved & set(SKIPPED): raise SystemExit('Спорный ID попал в подтверждённый список')

          copied=[]
          rows=[]
          for product_id in APPROVED:
              product=by_id[product_id]
              source=source_by_id[product_id]
              source_images=[v for v in source.get('images',[]) if isinstance(v,str) and v]
              product_images=[v for v in source_images if not v.startswith('assets/interiors/')]
              interiors=[v for v in product.get('images',[]) if isinstance(v,str) and v.startswith('assets/interiors/')]
              if not product_images: raise SystemExit(f'ID {product_id}: нет товарных фотографий')
              gallery=[]; seen=set(); product_copied=[]
              for value in product_images+interiors:
                  clean=value.split('?',1)[0]
                  if clean in seen: continue
                  seen.add(clean); gallery.append(value)
                  if clean.startswith(f'assets/products/{product_id}/'):
                      source_path=SOURCE/clean; target=ROOT/clean
                      if not target.is_file():
                          if not source_path.is_file(): raise SystemExit(f'ID {product_id}: отсутствует {clean}')
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copy2(source_path,target)
                          copied.append(clean); product_copied.append(clean)
              cover=gallery[0]
              product['images']=gallery
              product['directImage']=cover
              rows.append({'product_id':product_id,'name':product.get('name',''),'cover':cover,'gallery_size':len(gallery),'copied_files':product_copied})

          for product_id,product in by_id.items():
              if product_id not in approved and product!=baseline_by_id[product_id]:
                  raise SystemExit(f'Изменена карточка вне списка: {product_id}')

          payload=json.dumps(products,ensure_ascii=False,separators=(',',':'))
          (ROOT/'catalog-source.html').write_text(main_text[:start]+payload+main_text[end:],encoding='utf-8')
          loader=ROOT/'catalog-loader.js'
          updated,count=re.subn(r'const assetVersion="[^"]+";','const assetVersion="20260801-confirmed-batch-11";',loader.read_text(encoding='utf-8'),count=1)
          if count!=1: raise SystemExit('Не найдена версия ассетов')
          loader.write_text(updated,encoding='utf-8')

          report={'version':1,'rule':'publish_visually_confirmed_only','batch':11,'published_products':len(APPROVED),'published_ids':APPROVED,'skipped_as_uncertain':SKIPPED,'copied_files':len(copied),'archived_products':len(hidden),'archived_products_changed':0,'previously_published_products':len(published),'total_confirmed_after_release':len(published)+len(APPROVED),'products':rows}
          (ROOT/'data/confirmed-photo-release-batch-11.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          if len(hidden)!=361 or report['total_confirmed_after_release']!=564: raise SystemExit('Неверные итоговые количества')
          for item in rows:
              first=str(by_id[item['product_id']]['images'][0]).split('?',1)[0]
              direct=str(by_id[item['product_id']].get('directImage') or '').split('?',1)[0]
              expected=str(item['cover']).split('?',1)[0]
              if first!=expected or direct!=expected or not Path(first).is_file(): raise SystemExit(f"ID {item['product_id']}: некорректная обложка")
          subprocess.run(['node','--check','image-zoom.js'],check=True)
          zoom=(ROOT/'image-zoom.js').read_text(encoding='utf-8')
          if 'touchstart' not in zoom or 'touchend' not in zoom: raise SystemExit('Не найдена поддержка свайпа')
          print(f'Подготовлено и проверено {len(APPROVED)} карточек; отложено {len(SKIPPED)}')
          PY

      - name: Commit confirmed release
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add assets/products catalog-source.html catalog-loader.js data/confirmed-photo-release-batch-11.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish 37 confirmed product covers in batch 11"
          git push origin HEAD:agent/publish-remaining-batch-11
