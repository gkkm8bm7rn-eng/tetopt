name: Compare primary photo hashes

on:
  push:
    branches:
      - agent/fix-primary-product-photos
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install image support
        run: python -m pip install --quiet pillow

      - name: Compare product photos with approved main views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          EXPECTED = {
              493: {
                  'ahash': 'ffffe07fe07fe07ff03ff03ff03ff00ff00ffa4ffa6ff26ff26ff6e7feefffff',
                  'dhash': '0b00b720b520b600120058105b0058005c202b242ba41a341a345a1012500200',
              },
              136: {
                  'ahash': 'fffff07ff07ff07ff03ff00ff81ffa5ff00ff00ff00ff00ff42ff4effcffffff',
                  'dhash': '0f005b20592059005b005c042ea02aa82aa01aa01aa45aa45ab452b416700680',
              },
              656: {
                  'ahash': 'fffff07ff07ff07ff07ff07ff37ff00ff007f067f607f667e667e6e7feffffff',
                  'dhash': '37003300530059005920592019001b005a405a3053105310333033102a500200',
              },
              1182: {
                  'ahash': 'fffff0fff0fff0fff07ff07ff00ff06ff00ff80ffe3fff7ffc3ff18ff6efffff',
                  'dhash': '02005a405a405a405a205b005f041d241b203f84078013200d4055c413240740',
              },
              896: {
                  'ahash': 'ffffffffc07f807f803fc03fc03fc001e001e003fe3ff67ff00ff81ff7cfffff',
                  'dhash': '40001e00fe20d120d310d2806c806184703cbe604f8051045f043cc030700200',
              },
              33: {
                  'ahash': 'fc1fe007e007f81ffc3ff83ffa9ff59ff5afe5afedb7edd7c83be013f9e7fdff',
                  'dhash': '0f00b982b0721e0026882cc02a885aa056d4b4d0a45264486d49bd491c302480',
              },
          }

          def ahash(image, size=16):
              image = image.convert('L').resize((size, size), Image.Resampling.LANCZOS)
              pixels = list(image.getdata())
              average = sum(pixels) / len(pixels)
              bits = ''.join('1' if value >= average else '0' for value in pixels)
              return f'{int(bits, 2):0{size * size // 4}x}'

          def dhash(image, size=16):
              image = image.convert('L').resize((size + 1, size), Image.Resampling.LANCZOS)
              pixels = list(image.getdata())
              bits = []
              for y in range(size):
                  row = pixels[y * (size + 1):(y + 1) * (size + 1)]
                  bits.extend('1' if row[x] > row[x + 1] else '0' for x in range(size))
              return f'{int("".join(bits), 2):0{size * size // 4}x}'

          def distance(left, right):
              return (int(left, 16) ^ int(right, 16)).bit_count()

          result = []
          for product_id, expected in EXPECTED.items():
              folder = Path('assets/products') / str(product_id)
              candidates = []
              for path in sorted(folder.glob('*')):
                  if not path.is_file():
                      continue
                  try:
                      with Image.open(path) as image:
                          current_a = ahash(image)
                          current_d = dhash(image)
                          width, height = image.size
                  except Exception as exc:
                      candidates.append({'path': str(path), 'error': str(exc)})
                      continue
                  a_distance = distance(current_a, expected['ahash'])
                  d_distance = distance(current_d, expected['dhash'])
                  candidates.append({
                      'path': str(path).replace('\\', '/'),
                      'width': width,
                      'height': height,
                      'ahash': current_a,
                      'dhash': current_d,
                      'ahashDistance': a_distance,
                      'dhashDistance': d_distance,
                      'combinedDistance': a_distance + d_distance,
                  })
              candidates.sort(key=lambda item: item.get('combinedDistance', 10**9))
              result.append({
                  'id': product_id,
                  'approvedReference': expected,
                  'bestMatch': candidates[0] if candidates else None,
                  'candidates': candidates,
              })

          output = Path('data/primary-photo-hash-comparison.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Wrote {output}')
          PY

      - name: Commit comparison
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/primary-photo-hash-comparison.json
          git commit -m "Compare approved main photos with catalog assets"
          git push origin "HEAD:${TARGET_BRANCH}"
