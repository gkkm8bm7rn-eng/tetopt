name: Probe public next staging

on:
  push:
    branches: [main]
    paths:
      - 'next/**'
      - '.github/workflows/probe-next-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: https://tetopt.m78m6cfc2v.workers.dev
    steps:
      - name: Wait for public next route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            code=$(curl -L -sS -o /tmp/next.html -w '%{http_code}' "$BASE_URL/next/" || true)
            if [ "$code" = "200" ] && grep -q 'FORMA HOME — новый каталог' /tmp/next.html; then
              echo "Public /next/ is available on attempt $attempt"
              break
            fi
            echo "Attempt $attempt: /next/ returned HTTP $code or unexpected HTML"
            if [ "$attempt" = "24" ]; then
              echo 'Public /next/ did not become available in time'
              head -c 1000 /tmp/next.html || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify public staging assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$BASE_URL/next/app.js" -o /tmp/app.js
          curl -L --fail --silent --show-error "$BASE_URL/next/variant-labels.js" -o /tmp/variant-labels.js
          curl -L --fail --silent --show-error "$BASE_URL/catalog.json" -o /tmp/catalog.json
          grep -q "const PAGE_SIZE = 24" /tmp/app.js
          grep -q "variantLabelsReady" /tmp/variant-labels.js
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/catalog.json', encoding='utf-8'))
          products=data if isinstance(data,list) else data.get('products',[])
          variants=0
          for model in products:
              colors=model.get('colors') or []
              if colors:
                  variants += sum(len(c.get('variants') or []) for c in colors)
              else:
                  variants += len(model.get('variants') or [])
          assert len(products)==542, len(products)
          assert variants==1196, variants
          print(f'Public catalog OK: {len(products)} models, {variants} variants')
          PY

      - name: Verify root remains separate
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$BASE_URL/" -o /tmp/root.html
          grep -q '<title>FORMA HOME</title>' /tmp/root.html
          if grep -q 'FORMA HOME — новый каталог' /tmp/root.html; then
            echo 'Root unexpectedly serves next client'
            exit 1
          fi
          echo 'Root storefront remains separate from /next/'
