name: Temporary deployment source check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-host-check.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check fresh main probe on live hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/probe
          expected=$(cat deployment-source-probe.txt)
          check(){
            name="$1"; url="$2/deployment-source-probe.txt?probe=${GITHUB_SHA}"
            seen=false
            body=''
            status='000'
            final=''
            for i in $(seq 1 18); do
              meta=$(curl -L -sS -D "/tmp/probe/${name}-headers.txt" -o "/tmp/probe/${name}-body.txt" -w '%{http_code}|%{url_effective}' "$url" || true)
              status=${meta%%|*}; final=${meta#*|}
              body=$(cat "/tmp/probe/${name}-body.txt" 2>/dev/null || true)
              if [ "$status" = "200" ] && [ "$body" = "$expected" ]; then seen=true; break; fi
              sleep 10
            done
            NAME="$name" STATUS="$status" FINAL="$final" SEEN="$seen" BODY="$body" python - <<'PY'
          import json, os
          path='data/deployment-source-check.json'
          try:
              with open(path,encoding='utf-8') as f: out=json.load(f)
          except Exception:
              out={}
          out[os.environ['NAME']]={
              'http_status':os.environ['STATUS'],
              'final_url':os.environ['FINAL'],
              'fresh_main_probe_visible':os.environ['SEEN']=='true',
              'body':os.environ['BODY'],
          }
          with open(path,'w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          }
          check pages 'https://gkkm8bm7rn-eng.github.io/tetopt'
          check cloudflare 'https://tetopt.m78m6cfc2v.workers.dev'
      - name: Save result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deployment-source-check.json
          git commit -m 'Record temporary deployment source check' || exit 0
          git push origin HEAD:main
