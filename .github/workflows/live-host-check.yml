name: Temporary deployment source check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-host-check.yml'

concurrency:
  group: temporary-deployment-source-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check current main probe on live hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/probe
          python - <<'PY'
          import json, subprocess
          expected=open('deployment-source-probe.txt',encoding='utf-8').read()
          hosts={
            'pages':'https://gkkm8bm7rn-eng.github.io/tetopt/deployment-source-probe.txt',
            'cloudflare':'https://tetopt.m78m6cfc2v.workers.dev/deployment-source-probe.txt',
          }
          out={}
          for name,url in hosts.items():
              p=subprocess.run(['curl','-L','-sS','-w','\n__STATUS__%{http_code}\n__FINAL__%{url_effective}','-o','-','--max-time','20',url+'?check=current'],capture_output=True,text=True)
              text=p.stdout
              body,status,final=text,'000',url
              if '\n__STATUS__' in text:
                  body,tail=text.rsplit('\n__STATUS__',1)
                  status,finalpart=tail.split('\n__FINAL__',1)
                  final=finalpart.strip()
              out[name]={'http_status':status.strip(),'final_url':final,'fresh_main_probe_visible':body==expected,'body':body}
          with open('data/deployment-source-check.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
      - name: Save result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deployment-source-check.json
          git commit -m 'Record temporary deployment source check' || exit 0
          git push origin HEAD:main
