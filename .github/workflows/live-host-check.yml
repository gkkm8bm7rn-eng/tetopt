name: Temporary Cloudflare source check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-host-check.yml'

concurrency:
  group: temporary-cloudflare-source-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish invisible main probe in index
        shell: bash
        run: |
          set -euo pipefail
          token="CF_MAIN_SOURCE_PROBE_${GITHUB_SHA}"
          TOKEN="$token" python - <<'PY'
          import os
          p='index.html'
          s=open(p,encoding='utf-8').read()
          token=os.environ['TOKEN']
          s=s.replace('<head>','<head>\n  <!-- '+token+' -->',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Temporary main core deployment probe'
          git push origin HEAD:main
          echo "$token" > /tmp/probe-token
      - name: Wait for live hosts
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/probe-token)
          check_host(){
            name="$1"; base="$2"; seen=false; status=000; tries=0
            for i in $(seq 1 18); do
              tries=$i
              status=$(curl -L -sS -o "/tmp/${name}-index.html" -w '%{http_code}' --max-time 20 "$base/index.html?source_probe=$token-$i" || true)
              if [ "$status" = "200" ] && grep -q "$token" "/tmp/${name}-index.html"; then seen=true; break; fi
              sleep 10
            done
            printf '%s|%s|%s\n' "$seen" "$status" "$tries" > "/tmp/${name}-result"
          }
          check_host pages 'https://gkkm8bm7rn-eng.github.io/tetopt' &
          p1=$!
          check_host cloudflare 'https://tetopt.m78m6cfc2v.workers.dev' &
          p2=$!
          wait "$p1" "$p2"
      - name: Remove probe and record result
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/probe-token)
          TOKEN="$token" python - <<'PY'
          import json, os, re
          p='index.html'
          s=open(p,encoding='utf-8').read()
          token=os.environ['TOKEN']
          s=s.replace('  <!-- '+token+' -->\n','',1)
          open(p,'w',encoding='utf-8').write(s)
          out={}
          for name in ('pages','cloudflare'):
              seen,status,tries=open('/tmp/'+name+'-result',encoding='utf-8').read().strip().split('|')
              out[name]={'probe_seen':seen=='true','http_status':status,'tries':int(tries)}
          out['probe_token']=token
          out['meaning']='probe_seen=true means this host picked up a fresh invisible index.html change pushed only to main during this workflow'
          os.makedirs('data',exist_ok=True)
          with open('data/cloudflare-source-check.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          git add index.html data/cloudflare-source-check.json
          git commit -m 'Record Cloudflare source check and remove probe'
          git push origin HEAD:main
