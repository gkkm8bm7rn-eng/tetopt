name: Apply visually verified front photos

on:
  push:
    branches:
      - agent/visually-fix-primary-photos

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: agent/visually-fix-primary-photos
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow imagehash requests

      - name: Download selected official photos and update catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import imagehash, io, json, re, requests, zipfile

          # Each filename was chosen by visual inspection of the complete official TetChair archive.
          SELECTED = {
            298:  (25405, 'Доп.фото 5.jpg'),
            894:  (25433, 'Доп.фото 5.jpg'),
            899:  (25506, 'Основное фото.jpg'),
            908:  (25118, 'Основное фото.jpg'),
            893:  (25718, 'Доп.фото 5.jpg'),
            863:  (25122, 'Основное фото.jpg'),
            855:  (25273, 'Доп.фото 6.jpg'),
            307:  (25707, 'Основное фото.jpg'),
            33:   (19252, 'Основное фото.jpg'),
            656:  (20437, 'Доп.фото 5.jpg'),
            843:  (25842, 'Доп.фото 5.jpg'),
            1182: (25661, 'Доп.фото 6.jpg'),
            493:  (26023, 'Доп.фото 5.jpg'),
            896:  (25435, 'Доп.фото 5.jpg'),
            189:  (24554, 'Доп.фото 5.jpg'),
            136:  (24914, 'Доп.фото 5.jpg'),
          }

          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0'

          source_path = Path('catalog-source.html')
          text = source_path.read_text(encoding='utf-8')
          marker = '    const PRODUCTS = '
          start = text.find(marker)
          if start < 0:
            raise SystemExit('PRODUCTS marker not found')
          value_start = start + len(marker)
          end = text.find(';\n', value_start)
          if end < 0:
            raise SystemExit('PRODUCTS array end not found')
          products = json.loads(text[value_start:end])
          by_id = {int(p['id']): p for p in products}

          audit = []
          for product_id, (code, archive_basename) in SELECTED.items():
            product = by_id.get(product_id)
            if product is None:
              raise SystemExit(f'Product {product_id} not found')

            url = f'https://price.tetchair.ru/download_photo/?id={code}'
            response = session.get(url, timeout=120, allow_redirects=True)
            response.raise_for_status()
            if not zipfile.is_zipfile(io.BytesIO(response.content)):
              raise SystemExit(f'Official archive for {product_id}/{code} is not a ZIP')

            with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              matches = [name for name in archive.namelist() if Path(name).name == archive_basename]
              if not matches:
                raise SystemExit(f'{archive_basename!r} not found in archive {code}')
              official_bytes = archive.read(matches[0])

            official_image = Image.open(io.BytesIO(official_bytes)).convert('RGB')
            official_hash = imagehash.phash(official_image, hash_size=16)

            folder = Path('assets/products') / str(product_id)
            folder.mkdir(parents=True, exist_ok=True)
            candidates = []
            for path in sorted(folder.glob('*')):
              if not path.is_file():
                continue
              try:
                with Image.open(path) as image:
                  current_hash = imagehash.phash(image.convert('RGB'), hash_size=16)
                candidates.append((official_hash - current_hash, path))
              except Exception:
                continue
            candidates.sort(key=lambda item: item[0])

            if candidates and candidates[0][0] <= 10:
              primary_path = candidates[0][1]
              match_distance = candidates[0][0]
              source_kind = 'existing_visual_match'
            else:
              primary_path = folder / '00-front.webp'
              export = official_image.copy()
              export.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              export.save(primary_path, 'WEBP', quality=90, method=6)
              match_distance = candidates[0][0] if candidates else None
              source_kind = 'new_official_front'

            primary = str(primary_path).replace('\\', '/')
            before = [image for image in product.get('images', []) if image]

            # Moncler had two unrelated images in its local gallery; keep only the verified model photo.
            if product_id == 307:
              after = [primary]
            else:
              after = [primary] + [image for image in before if image != primary]
              after = list(dict.fromkeys(after))

            product['images'] = after
            product['directImage'] = primary
            audit.append({
              'id': product_id,
              'name': product.get('name'),
              'specs': product.get('specs'),
              'officialCode': code,
              'officialArchiveImage': archive_basename,
              'primaryImage': primary,
              'sourceKind': source_kind,
              'closestExistingHashDistance': match_distance,
              'before': before,
              'after': after,
              'rule': 'whole_product_front_or_front_three_quarter',
            })

          new_array = json.dumps(products, ensure_ascii=False, separators=(',', ':'))
          source_path.write_text(text[:value_start] + new_array + text[end:], encoding='utf-8')

          loader_path = Path('catalog-loader.js')
          loader = loader_path.read_text(encoding='utf-8')
          replacement = 'const assetVersion="20260731-visual-front-v2";'
          loader, count = re.subn(r'const assetVersion="[^"]+";', replacement, loader, count=1)
          if count != 1:
            raise SystemExit('assetVersion marker not updated')
          loader_path.write_text(loader, encoding='utf-8')

          audit_path = Path('data/visual-front-photo-audit.json')
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated {len(audit)} products')
          PY

      - name: Commit verified official front photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source.html catalog-loader.js data/visual-front-photo-audit.json assets/products
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use visually verified official front photos"
          git push origin HEAD:agent/visually-fix-primary-photos
