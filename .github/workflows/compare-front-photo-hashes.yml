name: Compare front photo hashes

on:
  push:
    branches:
      - agent/fix-primary-product-photos
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Compare with approved front views
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          EXPECTED = {
              493: ('fffff81ff81ff81ff81ff81ff81ff81ff81ff99ff99ff99ffb9ffbdffbdfffff', '0c802dc82d482d082d882c482c480d001c002d482d482d482948296829680860'),
              136: ('ffbff81ff81ff81ff81ff81ff81ff99ff99ffb9ff81ff81ff81ff3dff3dfffff', '0dc02dc82cc82cc82cc828881c480d402d402c482d482d482968286838681860'),
              656: ('fffff81ff81ff81ff81ff81ff99ff81ff01ff3dff01ff3dff3dff3dff3dfffff', '0c402d482d482d482d402d402d402d401c48086819681968186819681a681860'),
              1182: ('fffffc3ffc3ffc3ff81ffc3ff81fd81ff81ff81ffe7ffe7ff83ff6dffeffffff', '00003690269026902c8026906e886e886e882e88670023002c803b6013200000'),
              896: ('fffffffff00fe007e007e007e007e007e007e007f03ffe7ff00ff01ff7cfffff', '00001e60b802b0a2b062b442b652f77063707c80370031085f045cc030700200'),
          }

          def ahash(image, size=16):
              image = image.convert('L').resize((size, size), Image.Resampling.LANCZOS)
              pixels = list(image.getdata())
              average = sum(pixels) / len(pixels)
              bits = ''.join('1' if value >= average else '0' for value in pixels)
              return f'{int(bits, 2):0{size * size // 4}x}'

          def dhash(image, size=16):
              image = image.convert('L').resize((size + 1, size), Image.Resampling.LANCZOS)
              pixels = list(image.getdata())
              bits = []
              for y in range(size):
                  row = pixels[y * (size + 1):(y + 1) * (size + 1)]
                  bits.extend('1' if row[x] > row[x + 1] else '0' for x in range(size))
              return f'{int("".join(bits), 2):0{size * size // 4}x}'

          def distance(left, right):
              return (int(left, 16) ^ int(right, 16)).bit_count()

          output_rows = []
          for product_id, (expected_a, expected_d) in EXPECTED.items():
              rows = []
              for path in sorted((Path('assets/products') / str(product_id)).glob('*')):
                  if not path.is_file():
                      continue
                  with Image.open(path) as image:
                      current_a = ahash(image)
                      current_d = dhash(image)
                  rows.append({
                      'path': str(path).replace('\\', '/'),
                      'ahashDistance': distance(current_a, expected_a),
                      'dhashDistance': distance(current_d, expected_d),
                      'combinedDistance': distance(current_a, expected_a) + distance(current_d, expected_d),
                  })
              rows.sort(key=lambda row: row['combinedDistance'])
              output_rows.append({'id': product_id, 'bestMatch': rows[0] if rows else None, 'candidates': rows})

          output = Path('data/front-photo-hash-comparison.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(output_rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit comparison
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/front-photo-hash-comparison.json
          git commit -m "Compare catalog photos with approved front views"
          git push origin "HEAD:${TARGET_BRANCH}"
