name: Temporary safe merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Delete branches fully contained in main
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/deleted.txt
          : > /tmp/kept.txt
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | while IFS= read -r ref; do
            [ "$ref" = "origin/HEAD" ] && continue
            name="${ref#origin/}"
            case "$name" in
              main|backup-main-before-atelier-2026-08-16|backup-dimensions-2026-08-09|site-finalization-backup)
                echo "$name" >> /tmp/kept.txt
                continue
                ;;
            esac
            if git merge-base --is-ancestor "$ref" origin/main; then
              if git push origin --delete "$name"; then
                echo "$name" >> /tmp/deleted.txt
              fi
            else
              echo "$name" >> /tmp/kept.txt
            fi
          done
          mkdir -p data
          {
            echo "deleted_count=$(wc -l < /tmp/deleted.txt | tr -d ' ')"
            echo "kept_count=$(wc -l < /tmp/kept.txt | tr -d ' ')"
            echo "--- deleted ---"
            cat /tmp/deleted.txt
            echo "--- kept ---"
            cat /tmp/kept.txt
          } > data/branch-cleanup-summary.txt
      - name: Save summary and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/cleanup-merged-branches-temp.yml
          git add data/branch-cleanup-summary.txt
          git commit -m 'Clean fully merged obsolete branches'
          git push origin HEAD:main
