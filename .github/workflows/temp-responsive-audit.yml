name: Temporary Atelier responsive audit
on:
  push:
    branches: [forma-atelier-zero-2026]
    paths:
      - '.tmp-responsive-audit.mjs'
      - '.github/workflows/temp-responsive-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/forma-http.log 2>&1 &
          sleep 2
      - name: Responsive interaction audit
        run: node .tmp-responsive-audit.mjs
      - name: Verify price data unchanged since corrected Excel sync
        run: |
          git diff --exit-code a60fb3330ca5a4e4e2659d72bc0d6bf83e16b4b9 -- data/catalog-index.json data/details/
          echo 'Atelier wholesale price data is unchanged since verified price-sync commit a60fb333.'
      - name: Validate scripts
        run: |
          node --check app.js
          node --check variants.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-screenshots
          path: audit-*.png
