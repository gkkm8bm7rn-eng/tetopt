name: Temporary Atelier wholesale-price sync

on:
  push:
    branches:
      - forma-atelier-zero-2026
    paths:
      - '.tmp-atelier-price-update/**'
      - '.github/workflows/temp-atelier-wholesale-sync.yml'

permissions:
  contents: write

jobs:
  update-atelier-wholesale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atelier branch
        uses: actions/checkout@v4
        with:
          ref: forma-atelier-zero-2026
          fetch-depth: 0

      - name: Fetch current main source
        run: git fetch origin main:refs/remotes/origin/main

      - name: Apply approved wholesale prices to Atelier data
        run: python .tmp-atelier-price-update/update_from_main.py

      - name: Commit only Atelier data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-index.json data/details/*.json
          if git diff --cached --quiet; then
            echo "No Atelier price changes needed"
          else
            git commit -m "Correct Atelier wholesale prices from approved Excel"
            git push origin HEAD:forma-atelier-zero-2026
          fi
