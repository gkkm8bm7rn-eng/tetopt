name: Apply mobile all and question contact
on:
  push:
    branches: [mobile-all-question-contact]
    paths:
      - scripts/patch-mobile-all-question.py
      - .github/workflows/mobile-all-question-contact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-all-question-contact
          fetch-depth: 0
      - name: Apply patch
        run: |
          sed -i '/^assert app.read_text/d;/^assert "actions.insertBefore/d' scripts/patch-mobile-all-question.py
          python scripts/patch-mobile-all-question.py
      - name: Verify JavaScript and behavior markers
        run: |
          node --check app.js
          node --check cart-feedback.js
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          cart=Path('cart-feedback.js').read_text(encoding='utf-8')
          assert app.count('data-reset-all-products') == 1
          assert 'dataset.resetAllProducts' in app
          assert 'resetFilters();requestAnimationFrame' in app
          assert 'mobileReset}${mobileSections}' in app
          assert "actions.insertBefore(trigger,delivery)" in cart
          assert 'https://wa.me/?text=' in cart
          assert 'https://t.me/share/url?url=' in cart
          assert "'mailto:'+ORDER_EMAIL" in cart
          assert "getElementById('questionButton')" in cart
          print('targeted assertions passed')
          PY
          git diff --check -- app.js cart-feedback.js
      - name: Commit result
        run: |
          git config user.name 'FORMA HOME ui bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js cart-feedback.js
          git rm -f scripts/patch-mobile-all-question.py .github/workflows/mobile-all-question-contact.yml
          git diff --cached --check
          git commit -m 'Add mobile all products reset and question contact'
          git push origin HEAD:mobile-all-question-contact
